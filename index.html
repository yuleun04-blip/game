<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>서울 스트리트 3D</title>
<style>
html,body{margin:0;height:100%;background:#9cc8ec;overflow:hidden;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%}
#hud{pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,.28) 100%)}
#help{position:fixed;left:10px;bottom:10px;color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.6;pointer-events:none;max-width:60vw}
#touch{display:none}
.touch #touch{display:block}
.touch #help{display:none}
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.45);touch-action:none}
#knob{position:absolute;left:43px;top:43px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#btns{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,62px);gap:10px;align-items:end}
#btns button,#bW{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);color:#fff;font-size:12px;font-weight:bold;line-height:1.15;touch-action:none;padding:0;font-family:inherit}
#btns button.on{background:rgba(255,211,77,.55)}
#btns button span,#bW span{font-size:20px;display:block}
#bF{grid-column:3;grid-row:1/3;height:134px!important;border-radius:31px!important;background:rgba(46,204,113,.4)!important}
#bAtk{position:fixed;right:calc(88px + env(safe-area-inset-right));bottom:calc(164px + env(safe-area-inset-bottom));width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(231,76,60,.5);color:#fff;font-size:12px;font-weight:bold;touch-action:none;padding:0;font-family:inherit;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#bAtk span{font-size:28px;display:block;line-height:1.1}
#bAtk.on{background:rgba(255,120,60,.85);transform:scale(.94)}
#bW{position:fixed;right:calc(178px + env(safe-area-inset-right));bottom:calc(176px + env(safe-area-inset-bottom));width:52px;height:52px;font-size:10px}
.incar #bAtk,.incar #bW,.inside #bW{display:none}
.incar #bR,body:not(.incar) #bHB{opacity:.35}
#menuBtn{position:fixed;left:calc(10px + env(safe-area-inset-left));top:calc(126px + env(safe-area-inset-top));width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.45);color:#fff;font-size:22px;padding:0;touch-action:none;z-index:5}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(16,18,26,.95);color:#fff;border-radius:16px;padding:14px 14px 10px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:pan-y;z-index:20;box-sizing:border-box;-webkit-overflow-scrolling:touch}
#panel.show{display:block}
#panel h2{margin:0 0 2px;font-size:20px}
#panel .sub{color:#aab;font-size:13px;margin-bottom:8px;line-height:1.5}
#panel .tabs{display:flex;gap:6px;margin:6px 0 8px;flex-wrap:wrap}
#panel .tabs button{flex:1;min-width:64px;padding:8px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:13px;font-weight:bold}
#panel .tabs button.sel{background:#ffd34d;color:#222}
.it{display:flex;align-items:center;gap:10px;width:100%;margin:5px 0;padding:9px 11px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;font:inherit;text-align:left;cursor:pointer;box-sizing:border-box}
.it:disabled{opacity:.38}
.it:not(:disabled):active{background:rgba(255,211,77,.25)}
.it .ic{font-size:24px;width:30px;text-align:center;flex:none}
.it .nm{flex:1;font-weight:bold;font-size:15px}
.it .ds{display:block;font-weight:normal;font-size:12px;color:#bbc;margin-top:2px}
.it .pr{font-weight:bold;color:#7CFC7C;white-space:nowrap}
.it.sm{flex:1;min-width:0;flex-direction:column;gap:2px;padding:7px 4px;text-align:center}.it.sm .ic{display:none}.it.sm .nm{font-size:13px;flex:none}.it.sm .pr{font-size:12px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.up{color:#ff6b6b}.dn{color:#4da3ff}
#closeP{display:block;width:100%;margin-top:8px;padding:11px;border-radius:12px;border:0;background:#444a5a;color:#fff;font:inherit;font-weight:bold;font-size:15px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<canvas id="hud"></canvas>
<div id="help">WASD 이동 · J/클릭 공격 · Q 무기 교체 · F 탑승/들어가기/이용 · M 휴대폰 · Space 핸드브레이크 · Shift 달리기 · H 경적 · C 시점</div>
<button id="menuBtn">📱</button>
<div id="touch">
  <button id="bAtk"><span>👊</span>공격</button>
  <button id="bW"><span>🔄</span>무기</button>
  <div id="joy"><div id="knob"></div></div>
  <div id="btns">
    <button id="bCam"><span>🎥</span>시점</button>
    <button id="bH"><span>📢</span>경적</button>
    <button id="bF"><span id="bFi">🚗</span><b id="bFt">탑승<br>하차</b></button>
    <button id="bR"><span>🏃</span>달리기</button>
    <button id="bHB"><span>🛑</span>핸브</button>
  </div>
</div>
<div id="panel"></div>
<script>
// ===== 서울 스트리트 3D (WebGL, 외부 라이브러리 없음) =====
const glc=document.getElementById('gl'),hud=document.getElementById('hud'),ctx=hud.getContext('2d');
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(isTouch)document.body.classList.add('touch');
let VW=innerWidth,VH=innerHeight,DPR=1,GDPR=1;
let camYaw=0,camMode=0,camSnap=true;
const touch={active:false,x:0,y:0,hb:false,run:false,atk:false};
function inputVec(){
  if(touch.active)return {x:touch.x,y:touch.y};
  return {x:K('KeyD','ArrowRight')-K('KeyA','ArrowLeft'),y:K('KeyS','ArrowDown')-K('KeyW','ArrowUp')};
}
const HB=()=>K('Space')||touch.hb;
const RUN=()=>K('ShiftLeft','ShiftRight')||touch.run;
const keys={};const K=(...a)=>a.some(k=>keys[k]);

const G=400,RW=30,COLS=10,ROWS=8,WW=COLS*G,WH=ROWS*G;
const RIVER_T=1500,RIVER_B=1700;
const BRIDGES={2:'마포대교',5:'한남대교',8:'성수대교'};
const DX=[1,0,-1,0],DY=[0,1,0,-1],DIRA=[0,Math.PI/2,Math.PI,-Math.PI/2];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};
const lerpAng=(a,b,t)=>a+angDiff(b,a)*t;
const laneOff=d=>[15,-15,-15,15][d];
const won=n=>'₩'+Math.round(n).toLocaleString();

// ---------- 도로 / 지형 ----------
function isBridgeX(x){for(const c in BRIDGES)if(Math.abs(x-c*G)<RW+6)return true;return false}
function isWater(x,y){return y>RIVER_T&&y<RIVER_B&&!isBridgeX(x)}
function vRoad(c,y){if(c<0||c>COLS)return false;if(BRIDGES[c])return true;return !(y>1200+RW&&y<2000-RW)}
function inWorld(x,y){return x>=-RW&&x<=WW+RW&&y>=-RW&&y<=WH+RW}
function isRoad(x,y){
  if(!inWorld(x,y))return false;
  const c=Math.round(x/G),r=Math.round(y/G);
  if(Math.abs(x-c*G)<RW&&vRoad(c,y))return true;
  if(Math.abs(y-r*G)<RW&&r!==4&&r>=0&&r<=ROWS)return true;
  return false;
}
const NORTH=['홍대','마포','신촌','서대문','종로','명동','이태원','왕십리','성수','청량리'];
const SOUTH=['목동','영등포','노량진','동작','반포','강남','삼성','잠실','잠실','송파'];
function districtAt(x,y){
  if(player&&player.inside)return player.inside.door.role;
  const c=clamp(Math.floor(x/G),0,COLS-1),r=Math.floor(y/G);
  if(isWater(x,y))return '한강';
  if(y>1200&&y<2000)return '한강공원';
  if(r===5&&c<=1)return '여의도';
  return y<1200?NORTH[c]:SOUTH[c];
}
// 지역별 물가 (강남권 비쌈, 홍대·노량진 저렴)
const DPRICE={'강남':1.35,'삼성':1.3,'반포':1.25,'잠실':1.15,'송파':1.1,'여의도':1.2,'이태원':1.15,'명동':1.1,'종로':1.0,'홍대':.9,'신촌':.92,'노량진':.85,'영등포':.95,'마포':.97};

// ---------- 건물 역할 ----------
const ROLES={
  '편의점':{k:'store',i:'🏪',col:'#2e86de'},'약국':{k:'store',i:'💊',col:'#10ac84'},'카페':{k:'cafe',i:'☕',col:'#8e6e53'},
  '치킨':{k:'food',i:'🍗',col:'#f39c12'},'김밥':{k:'food',i:'🍙',col:'#27ae60'},'분식':{k:'food',i:'🍢',col:'#e67e22'},
  '떡볶이':{k:'food',i:'🌶️',col:'#e74c3c'},'국밥':{k:'food',i:'🍲',col:'#a0522d'},'고깃집':{k:'food',i:'🥩',col:'#c0392b'},
  '빵집':{k:'food',i:'🥐',col:'#d4a373'},'호프':{k:'food',i:'🍺',col:'#e1b12c'},
  '은행':{k:'bank',i:'🏦',col:'#34495e'},'총포사':{k:'gun',i:'🔫',col:'#2d3436'},'옷가게':{k:'clothes',i:'👕',col:'#e84393'},
  '미용실':{k:'clothes',i:'💇',col:'#fd79a8'},'헬스장':{k:'gym',i:'🏋️',col:'#636e72'},'PC방':{k:'pc',i:'🖥️',col:'#6c5ce7'},
  '정비소':{drive:true,i:'🔧',col:'#d35400'},'부동산':{k:'realty',i:'🏠',col:'#00b894'},'증권사':{k:'bank',i:'📈',col:'#0c2461'},
  '자동차 매장':{k:'dealer',i:'🚘',col:'#b33939'},'경찰서':{k:'police',i:'👮',col:'#2b4c8c'},'병원':{k:'hospital',i:'🏥',col:'#f2f2f2'},
  '홍대 클럽':{k:'club',i:'🪩',col:'#a02d7a'},'내 집':{k:'house',i:'🛏️',col:'#55efc4'},
};
const SIGNS=['편의점','편의점','편의점','카페','카페','치킨','김밥','분식','떡볶이','국밥','고깃집','빵집','호프','약국','은행','총포사','옷가게','미용실','헬스장','PC방','정비소','부동산'];
const FORCE={'5,1':['편의점','총포사','치킨','정비소'],'4,1':['은행','옷가게','카페','국밥'],'6,1':['약국','헬스장','PC방','부동산'],'5,0':['분식','미용실','증권사'],'5,5':['증권사','고깃집'],'1,6':['정비소','총포사']};

// ---------- 도시 생성 ----------
const cells={},allB=[],trees=[];
const SPECIAL={
  '4,0':{t:'palace',label:'경복궁'},
  '5,2':{t:'tower',label:'N서울타워'},
  '1,5':{t:'big',label:'63빌딩',col:'#d9a62e',ht:170,w:150,h:210},
  '6,5':{t:'big',label:'코엑스',col:'#8fa9b8',ht:50,w:260,h:190},
  '7,5':{t:'big',label:'롯데월드타워',col:'#d6dee6',ht:280,w:90,h:90},
  '7,2':{t:'park',label:'서울숲'},
  '8,6':{t:'park',label:'올림픽공원'},
  '3,1':{t:'mark',label:'경찰서',col:'#2b4c8c'},
  '6,0':{t:'mark',label:'병원',col:'#f2f2f2'},
  '5,6':{t:'mark',label:'강남역',col:'#3d6b4f'},
  '0,1':{t:'mark',label:'홍대 클럽',col:'#a02d7a'},
  '4,2':{t:'mark',label:'내 집',col:'#e0d6c8'},
  '7,1':{t:'mark',label:'자동차 매장',col:'#d8dde3'},
};
function shade(h,s,l){return {col:`hsl(${h},${s}%,${l}%)`,wall:`hsl(${h},${s}%,${Math.max(8,l-22)}%)`}}
function addB(cell,b){
  if(!b.col){const h=rnd(0,360)|0,s=rnd(4,22)|0,l=rnd(48,72)|0;Object.assign(b,shade(h,s,l))}
  if(!b.wall)b.wall='rgba(0,0,0,.45)';
  if(!b.ht)b.ht=rnd(20,110);
  cell.b.push(b);allB.push(b);
}
function addTrees(c,r,n){for(let i=0;i<n;i++)trees.push({x:c*G+rnd(40,G-40),y:r*G+rnd(40,G-40),r:rnd(9,16)})}
function buildCity(){
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    const k=c+','+r,cell={b:[],ground:null};cells[k]=cell;
    if(r===3||r===4){cell.ground='#5b9447';
      for(let i=0;i<10;i++){const y=r===3?rnd(1240,1480):rnd(1720,1960);trees.push({x:c*G+rnd(40,G-40),y,r:rnd(8,13)})}
      continue}
    const x0=c*G+RW+22,y0=r*G+RW+22,x1=(c+1)*G-RW-22,y1=(r+1)*G-RW-22,cx=c*G+G/2,cy=r*G+G/2;
    const sp=SPECIAL[k];
    if(sp&&sp.t==='palace'){cell.ground='#cdb68a';
      addB(cell,{x:cx-75,y:cy-45,w:150,h:90,col:'#3f5243',wall:'#7a2a24',ht:35,label:sp.label});
      addB(cell,{x:cx-30,y:y0,w:60,h:30,col:'#3f5243',wall:'#7a2a24',ht:25});
      continue}
    if(sp&&sp.t==='tower'){cell.ground='#467a39';addTrees(c,r,28);
      addB(cell,{x:cx-16,y:cy-16,w:32,h:32,col:'#eeeeee',wall:'#9aa0a6',ht:230,round:true,label:sp.label});continue}
    if(sp&&sp.t==='park'){cell.ground='#4f8a3c';addTrees(c,r,30);cell.label=sp.label;continue}
    if(sp&&sp.t==='big'){addB(cell,{x:cx-sp.w/2,y:cy-sp.h/2,w:sp.w,h:sp.h,col:sp.col,wall:'rgba(40,40,50,.7)',ht:sp.ht,label:sp.label});continue}
    const nx=Math.random()<.5?2:3,ny=Math.random()<.5?2:3,gap=16;
    const bw=(x1-x0-gap*(nx-1))/nx,bh=(y1-y0-gap*(ny-1))/ny;
    let first=true;const force=(FORCE[k]||[]).slice();
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){
      if(!first&&!force.length&&Math.random()<.1)continue;
      const ins=rnd(0,7),b={x:x0+i*(bw+gap)+ins,y:y0+j*(bh+gap)+ins,w:bw-2*ins,h:bh-2*ins,sign:Math.random()<.42?pick(SIGNS):null};
      if(first&&sp){b.label=sp.label;b.col=sp.col;b.sign=null;b.ht=60}
      else if(force.length)b.sign=force.shift();
      first=false;addB(cell,b);
    }
  }
  allB.sort((a,b)=>a.ht-b.ht);
}
buildCity();
// 출입문: 도로를 향한 면 가운데
const doors=[];
for(const b of allB){
  const role=b.sign||(b.label&&ROLES[b.label]?b.label:null);if(!role)continue;
  const bx=b.x+b.w/2,by=b.y+b.h/2,c=Math.floor(bx/G),r=Math.floor(by/G);
  const sides=[[b.x-c*G,-1,0],[(c+1)*G-(b.x+b.w),1,0],[b.y-r*G,0,-1],[(r+1)*G-(b.y+b.h),0,1]].sort((p,q)=>p[0]-q[0]);
  const s=sides.find(q=>isRoad(bx+q[1]*(b.w/2+q[0]),by+q[2]*(b.h/2+q[0])))||sides[0];
  const dx=bx+s[1]*b.w/2,dy=by+s[2]*b.h/2;
  const d={x:dx,y:dy,nx:s[1],ny:s[2],ox:dx+s[1]*13,oy:dy+s[2]*13,role,b,R:ROLES[role],id:doors.length};
  doors.push(d);b.door=d;
}
const HOME_DOOR=doors.find(d=>d.role==='내 집');

// ---------- 사람 외형 ----------
const SKIN=['#f1c9a0','#e8b98d','#d9a479','#f5d3b3'],SHIRT=['#e74c3c','#3498db','#f1c40f','#9b59b6','#ecf0f1','#34495e','#e67e22','#1abc9c','#ff7eb6','#222','#7f8c8d','#2c3e50','#c8d6e5','#a3cb38'];
const HAIRC=['#151010','#1f1612','#2a1d14','#3b2416','#5a3a22','#8a5a2b','#c9a25a','#7a2e2e'];
const PANTS=['#2d3440','#1f2a44','#3a5a8c','#4a4a4a','#c2b280','#222','#6b4f3a','#5f7a99'];
const SHOES=['#222','#eee','#7a4a2a','#333','#c0392b','#f5f5f5'];
function makeLook(){const f=Math.random()<.5;return {f,shirt:pick(SHIRT),pants:pick(PANTS),skin:pick(SKIN),hair:pick(HAIRC),hs:f?pick([1,2,2,3]):pick([0,0,1,4]),shoe:pick(SHOES),
  skirt:f&&Math.random()<.35,bag:Math.random()<.25?pick(['#6b4a2f','#222','#c0392b','#2c3e50']):null,cap:pick(['#c0392b','#2c3e50','#f1c40f','#fff']),h:rnd(.95,1.05)*(f?.95:1)}}

// ---------- 실내 (도시 밖 먼 곳에 방을 하나씩 만들어 둠) ----------
const IX0=20000,IW=200,ID=150;
const IKINDS=['store','cafe','food','bank','gun','clothes','gym','pc','realty','dealer','police','hospital','club','house'];
const IFLOOR={store:'#e8e4da',cafe:'#a07a55',food:'#c9a27a',bank:'#d8d2c4',gun:'#4a4a4a',clothes:'#efe6ee',gym:'#3a3f47',pc:'#2b2d42',realty:'#ddd5c8',dealer:'#f0f0f0',police:'#9aa3ad',hospital:'#e9f1f5',club:'#1b1430',house:'#b98b5e'};
const IWALL={store:'#f4f4f4',cafe:'#e9d8c4',food:'#f1e2c6',bank:'#e8e1d0',gun:'#6b5b4b',clothes:'#fbe9f1',gym:'#8f9aa6',pc:'#3d3f63',realty:'#f2efe6',dealer:'#e3e8ee',police:'#c8d2dc',hospital:'#ffffff',club:'#2d1b4e',house:'#efe3cf'};
const INTS={};

function intAt(x){const i=Math.floor((x-IX0+100)/400);return i>=0&&i<IKINDS.length?INTS[IKINDS[i]]:null}
function solid(x,y){
  if(x>IX0-150){const R=intAt(x);if(!R)return true;
    if(x<R.x0+4||x>R.x1-4||y<R.z0+4||y>R.z1-2)return true;
    for(const f of R.furn)if(!f.decor&&Math.abs(x-f.X)<f.hw+1&&Math.abs(y-f.Z)<f.hd+1)return true;return false}
  if(!inWorld(x,y))return true;
  if(isWater(x,y))return true;
  const cell=cells[Math.floor(x/G)+','+Math.floor(y/G)];if(!cell)return false;
  for(const b of cell.b)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)return true;
  return false;
}

  s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(audio.destination);

function light(c,r,axis){const o=SIG.get(c*100+r);if(o===undefined)return 'g';const t=(frame+o)%TL;
  if(axis===0)return t<170?'g':t<200?'y':'r';return t<210?'r':t<380?'g':t<410?'y':'r'}
function signalStop(c){
  const d=c.dir,horiz=d%2===0,s=d<2?1:-1,pos=horiz?c.x:c.y,front=pos+s*c.w/2;
  const k=s>0?Math.ceil((front+RW+4)/G):Math.floor((front-RW-4)/G);
  const line=k*G-s*(RW+6),dd=(line-front)*s;
  if(dd<-1||dd>95)return Infinity;
  const cc=horiz?k:Math.round(c.x/G),rr=horiz?Math.round(c.y/G):k;
  const L=light(cc,rr,horiz?0:1);
  if(L==='g'||(L==='y'&&dd<22))return Infinity;
  return Math.max(0,dd);
}

function carHits(car,x,y,a){
  const cs=Math.cos(a),sn=Math.sin(a),hw=car.w/2-2,hh=car.h/2-2;
  for(const [u,v] of [[hw,hh],[hw,-hh],[-hw,hh],[-hw,-hh],[hw,0],[-hw,0],[0,hh],[0,-hh]])
    if(solid(x+u*cs-v*sn,y+u*sn+v*cs))return true;
  return false;
}
function moveCar(car,dx,dy){
  let hit=false;
  if(!carHits(car,car.x+dx,car.y,car.a))car.x+=dx;else hit=true;
  if(!carHits(car,car.x,car.y+dy,car.a))car.y+=dy;else hit=true;
  if(hit){
    const sp=Math.abs(car.v);
    if(sp>4){car.hp-=sp*2.5;if(car===player.car){shake=sp*1.2;beep(90,.15,'square',.06)}}
    car.v*=-.3;car.vx*=-.3;car.vy*=-.3;
  }
  return hit;
}
function drivePlayer(c){
  const I=menuOpen?{x:0,y:0}:inputVec(),up=I.y<-.25,dn=I.y>.25,hb=HB(),thr=up?Math.min(1,-I.y*1.4):0;
  const alive=c.hp>0,tu=c.tune||1;
  if(alive&&up)c.v+=c.v<0?.35:c.acc*tu*thr;
  if(alive&&dn)c.v-=c.v>0?.3:.12;
  if(!up&&!dn)c.v*=.985;
  if(hb)c.v*=.965;
  if(!alive)c.v*=.94;
  c.v=clamp(c.v,-3.5,c.max*tu);
  const st=clamp(I.x,-1,1)*.05*clamp(c.v/3,-1,1)*(hb?1.6:1);
  const na=c.a+st;if(!carHits(c,c.x,c.y,na))c.a=na;
  const tx=Math.cos(c.a)*c.v,ty=Math.sin(c.a)*c.v,grip=hb?.05:.25;
  c.vx+=(tx-c.vx)*grip;c.vy+=(ty-c.vy)*grip;
  const slip=Math.hypot(tx-c.vx,ty-c.vy);
  if(slip>1.3&&Math.abs(c.v)>3){
    const cs=Math.cos(c.a),sn=Math.sin(c.a);
    for(const s of [-1,1])skids.push({x:c.x-cs*c.w*.35-sn*s*c.h*.4,y:c.y-sn*c.w*.35+cs*s*c.h*.4,life:600});
    if(frame%6===0)beep(rnd(500,700),.05,'sawtooth',.01);
  }
  moveCar(c,c.vx,c.vy);
}
function walkPlayer(){
  const I=menuOpen?{x:0,y:0}:inputVec(),m=Math.min(1,Math.hypot(I.x,I.y));player.moving=false;player.spd=0;
  if(m>.15){const base=RUN()?3.6:2.2,sp=base*m*(player.buff>0?1.3:1)*(player.hunger<=0?.75:1)*(player.atk>0?.45:1),fx=Math.cos(camYaw),fy=Math.sin(camYaw);
    let mx=fx*(-I.y)-fy*I.x,my=fy*(-I.y)+fx*I.x;const l=Math.hypot(mx,my);mx/=l;my/=l;
    if(player.aimT<=0)player.a=lerpAng(player.a,Math.atan2(my,mx),.35);player.moving=true;player.spd=sp;
    const nx=player.x+mx*sp,ny=player.y+my*sp;
    if(!solid(nx,player.y))player.x=nx;if(!solid(player.x,ny))player.y=ny;player.walk+=.1+sp*.055}
}
function aiDrive(c){
  const d=c.dir,horiz=d%2===0,look=c.w/2+22,ax=c.x+DX[d]*look,ay=c.y+DY[d]*look;
  let target=c.cruise,blocked=false;
  if(c.wait>200){c.ignore=60;c.wait=0}
  if(c.ignore>0)c.ignore--;
  else{
    for(const o of cars){if(o!==c&&Math.abs(o.x-ax)<o.w*.5+8&&Math.abs(o.y-ay)<o.w*.5+8){blocked=true;break}}
    if(!player.car&&!player.inside&&Math.hypot(player.x-ax,player.y-ay)<22)blocked=true;
    if(!blocked)for(const p of peds)if(p.down<=0&&Math.abs(p.x-ax)<14&&Math.abs(p.y-ay)<14){blocked=true;break}
    if(blocked)target=0;
  }
  if(!c.flee){const sd=signalStop(c);if(sd<Infinity)target=Math.min(target,Math.max(0,(sd-3)*.075))}
  if(blocked&&c.v<.3){c.wait++;if(c.wait===90&&dist(c,pp())<300)beep(380,.18,'sawtooth',.015)}else c.wait=0;
  c.v+=(target-c.v)*(target<c.v?.12:.06);
  const ix=Math.round(c.x/G)*G,iy=Math.round(c.y/G)*G,before=horiz?c.x:c.y;
  c.x+=DX[d]*c.v;c.y+=DY[d]*c.v;
  const after=horiz?c.x:c.y;
  if(horiz){const r=Math.round((c.y-laneOff(d))/G);c.y+=(r*G+laneOff(d)-c.y)*.1}
  else{const k=Math.round((c.x-laneOff(d))/G);c.x+=(k*G+laneOff(d)-c.x)*.1}
  if(c.v>.1){
    const straightOK=isRoad(ix+DX[d]*(RW+40),iy+DY[d]*(RW+40));
    let turned=false;
    for(const t of [(d+1)%4,(d+3)%4]){
      const line=horiz?ix+laneOff(t):iy+laneOff(t);
      if((before-line)*(after-line)<=0&&before!==after){
        const ok=isRoad(ix+DX[t]*(RW+40),iy+DY[t]*(RW+40));
        if(ok&&(!straightOK||Math.random()<(c.flee?.5:.3))){if(horiz)c.x=line;else c.y=line;c.dir=t;turned=true;break}
      }
    }
    if(!turned&&!isRoad(c.x+DX[c.dir]*(c.w/2+4),c.y+DY[c.dir]*(c.w/2+4))){
      const nd=(c.dir+2)%4;
      if(c.dir%2===0)c.y=Math.round(c.y/G)*G+laneOff(nd);else c.x=Math.round(c.x/G)*G+laneOff(nd);
      c.dir=nd;
    }
  }
  c.a=lerpAng(c.a,DIRA[c.dir],.2);
}
function damagePlayer(n){

  const ab=Math.min(player.armor,n*.7);player.armor-=ab;player.hp-=n-ab;player.hurt=Math.max(player.hurt,16);

function policeAI(c){
  if(c.hp<=0||wanted===0){c.v*=.95;moveCar(c,Math.cos(c.a)*c.v,Math.sin(c.a)*c.v);return}
  const P=anchor(),dx=P.x-c.x,dy=P.y-c.y,d=Math.hypot(dx,dy);
  const diff=angDiff(Math.atan2(dy,dx),c.a);
  let na=c.a;
  if(c.rev>0){c.rev--;c.v=Math.max(c.v-.25,-3);na-=clamp(diff,-.05,.05)}
  else{
    const target=d<70?(player.car?Math.min(8,Math.abs(player.car.v)+1):.3):(Math.abs(diff)>1.3?4:8.5);
    c.v+=clamp(target-c.v,-.35,.25);na+=clamp(diff,-.07,.07)*clamp(c.v/3,-1,1);
  }
  if(!carHits(c,c.x,c.y,na))c.a=na;
  const hit=moveCar(c,Math.cos(c.a)*c.v,Math.sin(c.a)*c.v);
  if(hit){if(++c.stuck>6){c.rev=35;c.stuck=0}}else c.stuck=Math.max(0,c.stuck-1);
  // 수배 3단계 이상: 경찰이 발포
  if(wanted>=3&&!player.inside&&d<230&&frame%50===c.id%50){
    tracers.push({x1:c.x,y1:14,z1:c.y,x2:P.x+rnd(-6,6),y2:10,z2:P.y+rnd(-6,6),life:6,col:[1,.9,.5]});
    noise(.08,1800,'highpass',.12);if(Math.random()<.6)damagePlayer(4+wanted)}
}
function coast(c){c.v*=.95;c.vx*=.95;c.vy*=.95;if(Math.abs(c.vx)+Math.abs(c.vy)>.05)moveCar(c,c.vx,c.vy)}
function tryShift(c,dx,dy){if(!carHits(c,c.x+dx,c.y+dy,c.a)){c.x+=dx;c.y+=dy}}
function carCollisions(){
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
    const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)>80||Math.abs(dy)>80)continue;
    const d=Math.hypot(dx,dy),m=a.w*.42+b.w*.42;
    if(d>=m||d===0)continue;
    const nx=dx/d,ny=dy/d,push=(m-d)/2;
    tryShift(a,-nx*push,-ny*push);tryShift(b,nx*push,ny*push);
    const va=[Math.cos(a.a)*a.v,Math.sin(a.a)*a.v],vb=[Math.cos(b.a)*b.v,Math.sin(b.a)*b.v];
    const rel=Math.hypot(va[0]-vb[0],va[1]-vb[1]);
    if(rel>3&&!(a.cd>frame)&&!(b.cd>frame)){
      a.cd=b.cd=frame+25;a.hp-=rel*1.5;b.hp-=rel*1.5;
      const pc=player.car;
      if(a===pc||b===pc){shake=rel;beep(80,.18,'square',.07);const o=a===pc?b:a;if(o.police&&o.driver&&rel>4&&!(window._rc>frame)){window._rc=frame+120;crime(1)}}
    }
    a.v*=.6;b.v*=.6;a.vx*=.6;a.vy*=.6;b.vx*=.6;b.vy*=.6;
  }
}
function explode(c){
  c.boom=true;c.hp=-999;c.driver=false;c.ai=false;
  for(let i=0;i<26;i++)sparks.push({x:c.x,y:6,z:c.y,vx:rnd(-3,3),vy:rnd(1,5),vz:rnd(-3,3),life:rnd(14,28)|0,fire:true});
  for(let i=0;i<14;i++)parts.push({x:c.x+rnd(-10,10),y:c.y+rnd(-10,10),vx:rnd(-.4,.4),vy:rnd(-.4,.4),life:90,r:rnd(8,14),dark:true});
  noise(.6,400,'lowpass',.7);beep(50,.5,'sine',.25);
  const P=pp(),dd=Math.hypot(P.x-c.x,P.y-c.y);if(dd<300)shake=Math.max(shake,18*(1-dd/300));

function hits(){

        p.down=300;p.angry=0;p.atk=0;p.hp=Math.min(p.hp,0);const kx=p.x+Math.cos(c.a)*20,ky=p.y+Math.sin(c.a)*20;if(!solid(kx,ky)){p.x=kx;p.y=ky}

// 화난 행인: 플레이어를 쫓아와서 반격
function angryPed(p){
  if(player.car||player.inside||dist(p,player)>420){p.angry=0;return false}
  p.angry--;const d=dist(p,player);p.a=Math.atan2(player.y-p.y,player.x-p.x);p.spd=0;
  if(p.atk>0)return true;
  if(d>14){const sp=p.boss?2.3:1.9,nx=p.x+Math.cos(p.a)*sp,ny=p.y+Math.sin(p.a)*sp;if(!solid(nx,p.y))p.x=nx;if(!solid(p.x,ny))p.y=ny;p.step+=.1+sp*.05;p.spd=sp}
  else if(p.atkCd<=0){p.atk=16;p.atkCd=p.boss?40:55;p.side=-(p.side||1)}
  return true;
}
function updatePeds(){
  const P=anchor();
  for(const p of peds){
    if(p.down>0){p.down--;if(p.down===0){p.hp=p.boss?0:3;p.hit=0;if(p.boss)p.down=1}continue}
    if(p.atkCd>0)p.atkCd--;
    if(p.atk>0){p.atk--;if(p.atk===9&&!player.car&&!player.inside&&player.hurt<=0&&dist(p,player)<20){
      damagePlayer(p.boss?12:8);player.hurt=24;shake=5;sfxHit(false);burst(player.x,11,player.y,5);pop(player.x,player.y,'윽!','#ff6b6b');
      const kx=player.x+Math.cos(p.a)*8,ky=player.y+Math.sin(p.a)*8;if(!solid(kx,ky)){player.x=kx;player.y=ky}}}
    if(p.stun>0){p.stun--;p.spd=0;continue}
    if(p.hit>0){p.hit--;p.spd=0;continue}
    if(p.boss&&!p.angry&&!player.car&&dist(p,player)<140)p.angry=9999;
    if(p.angry>0&&angryPed(p))continue;
    if(wanted>=2&&!p.flee&&dist(p,P)<150){p.flee=120;p.a=Math.atan2(p.y-P.y,p.x-P.x)}
    if(p.idle>0&&p.flee<=0){p.idle--;p.spd=0;continue}
    if(p.flee<=0&&Math.random()<.003){p.idle=rnd(60,240)|0;continue}
    const sp=p.flee>0?2.3:.6;if(p.flee>0)p.flee--;
    if(Math.random()<.01)p.a+=rnd(-1.5,1.5);
    const nx=p.x+Math.cos(p.a)*sp,ny=p.y+Math.sin(p.a)*sp;
    if(solid(nx,ny)||(p.flee<=0&&!isRoad(p.x,p.y)&&isRoad(nx,ny)&&Math.random()<.995)){p.a+=Math.PI*rnd(.5,1.5);p.spd=0}
    else{p.x=nx;p.y=ny;p.step+=.1+sp*.05;p.spd=sp}
  }
}
function populate(){
  const P=anchor();
  for(let i=cars.length-1;i>=0;i--){const c=cars[i];if(c===player.car||c.keep||c.owned)continue;const d=dist(c,P);
    if((c.ai&&c.driver&&!c.police&&d>1800)||(c.police&&(wanted===0||c.hp<=0)&&d>900)||(!c.driver&&d>2600&&!c.police&&cars.length>60)||(c.boom&&d>900))cars.splice(i,1)}
  for(let i=peds.length-1;i>=0;i--)if(!peds[i].keep&&dist(peds[i],P)>1500)peds.splice(i,1);
  const traffic=cars.filter(c=>c.ai&&c.driver&&!c.police&&!c.keep).length;
  if(traffic<MAX_TRAFFIC){const s=roadSpot(P.x,P.y,700,1300);if(s)makeCar(trafficType(),s.x,s.y,s.dir)}
  if(peds.length<MAX_PED){const s=pedSpot(P.x,P.y,600,1100);if(s)makePed(s.x,s.y)}

}

function randn(){return Math.sqrt(-2*Math.log(Math.random()+1e-9))*Math.cos(Math.PI*2*Math.random())}

function districtRaw(x,y){const c=clamp(Math.floor(x/G),0,COLS-1);if(y>1200&&y<2000)return '한강공원';if(Math.floor(y/G)===5&&c<=1)return '여의도';return y<1200?NORTH[c]:SOUTH[c]}
function priceOf(base,door){const d=door||(player.inside&&player.inside.door);let m=econ.infl;if(d){m*=DPRICE[districtRaw(d.x,d.y)]||1;if(player.biz.includes(d.id))m*=.5}return Math.max(100,Math.round(base*m/100)*100)}
function bizValue(d){return Math.round(60000*(DPRICE[districtRaw(d.x,d.y)]||1)*econ.infl/1000)*1000}

const WEAP={
  fist:{n:'주먹',i:'👊',melee:1,dmg:1,range:15},
  bat:{n:'야구방망이',i:'🏏',melee:1,dmg:2,range:20},
  taser:{n:'테이저건',i:'⚡',range:110,cd:40,stun:1},
  pistol:{n:'권총',i:'🔫',range:230,cd:13,dmg:2},
  shotgun:{n:'산탄총',i:'💥',range:120,cd:46,dmg:2,pellets:5},
};
const WORDER=['fist','bat','taser','pistol','shotgun'];
function switchWeapon(){const own=WORDER.filter(w=>player.weapons[w]);const i=own.indexOf(player.cur);player.cur=own[(i+1)%own.length];
  const W=WEAP[player.cur];toast(W.i+' '+W.n+(W.melee?'':` (${player.ammo[player.cur]}발)`));beep(500,.05,'triangle',.04)}
function sfxHit(heavy){noise(heavy?.2:.12,heavy?700:1200,'lowpass',heavy?.5:.32);beep(heavy?65:95,heavy?.18:.1,'sine',.18)}
function burst(x,y,z,n){for(let i=0;i<n;i++)sparks.push({x,y,z,vx:rnd(-1.6,1.6),vy:rnd(.4,2.2),vz:rnd(-1.6,1.6),life:rnd(10,18)|0})}
function pop(x,z,t,c){pops.push({x,y:18,z,t,c,life:42});if(pops.length>6)pops.shift()}
function attack(){
  if(!started||overlay||menuOpen||player.car)return;
  if(player.inside){if(!(window._iw>frame)){window._iw=frame+120;toast('실내에서는 싸울 수 없어요')}return}
  if(WEAP[player.cur].melee)punch();else shoot();
}
function punch(){
  if(player.atk>5)return;
  player.combo=player.comboT>0?player.combo%3+1:1;player.comboT=42;player.atk=16;player.side=player.combo===2?-1:1;
  let best=null,bd=42;
  for(const p of peds){if(p.down>0)continue;const d=dist(p,player);if(d<bd&&Math.abs(angDiff(Math.atan2(p.y-player.y,p.x-player.x),player.a))<1.5){bd=d;best=p}}
  if(best)player.a=Math.atan2(best.y-player.y,best.x-player.x);
  noise(.09,player.cur==='bat'?1500:2600,'bandpass',.12);
}
function koPed(p,byGun){
  p.down=byGun?600:360;p.angry=0;p.hp=0;
  if(!p.boss)crime(byGun?1:.35);
  for(const q of peds)if(q!==p&&!q.angry&&q.down<=0&&dist(q,p)<(byGun?320:180)){q.flee=220;q.a=Math.atan2(q.y-p.y,q.x-p.x)}
  if(Math.random()<.65){pickups.push({x:p.x+rnd(-6,6),y:p.y+rnd(-6,6),v:pick([100,200,300,500,1000]),life:1800});if(pickups.length>30)pickups.shift()}
}
function resolvePunch(){
  const W=WEAP[player.cur],heavy=player.combo===3,ca=Math.cos(player.a),sa=Math.sin(player.a),reach=W.range*.8,hx=player.x+ca*reach,hy=player.y+sa*reach;
  let hit=false;
  for(const p of peds){
    if(p.down>0||Math.hypot(p.x-hx,p.y-hy)>W.range)continue;
    hit=true;p.hp-=(W.dmg+(heavy?1:0))*player.str;p.hit=12;p.flee=0;p.atk=0;p.a=player.a+Math.PI;
    const kb=heavy?18:6,kx=p.x+ca*kb,ky=p.y+sa*kb;if(!solid(kx,ky)){p.x=kx;p.y=ky}
    if(p.hp<=0)koPed(p,false);
    else if(!p.angry&&(p.boss||Math.random()<.45)){p.angry=900;pop(p.x,p.y,'덤벼!','#ff9f43')}
    else if(!p.angry){p.flee=200;p.a=player.a}
  }
  if(!hit)for(const c of cars){
    if(c===player.car||Math.hypot(c.x-hx,c.y-hy)>c.w*.5+4)continue;
    hit=true;c.hp-=(heavy?6:3)*(W.dmg);if(c.police&&c.driver)crime(1);else if(c.driver&&c.ai)beep(420,.25,'sawtooth',.02);break;
  }
  if(hit){burst(hx,10,hy,heavy?14:7);shake=heavy?8:3.5;sfxHit(heavy);pop(hx,hy,heavy?'콰광!':pick(['퍽!','빡!','팍!']),heavy?'#ff5e3a':'#ffd34d')}
}
function shoot(){
  const id=player.cur,W=WEAP[id];if(player.cd>0)return;
  if(player.ammo[id]<=0){toast('탄약이 없어요 — 총포사에서 구매하세요','#ff6b6b');player.cd=40;beep(200,.05,'square',.03);return}
  player.ammo[id]--;player.cd=W.cd;player.aimT=26;
  let best=null,bs=1e9;
  for(const p of peds){if(p.down>0)continue;const dx=p.x-player.x,dy=p.y-player.y,d=Math.hypot(dx,dy);if(d>W.range||d<2)continue;
    const ad=Math.abs(angDiff(Math.atan2(dy,dx),player.a));if(ad>.65)continue;const sc=d*(1+ad*2);if(sc<bs){bs=sc;best=p}}
  if(!best)for(const c of cars){if(c.boom)continue;const dx=c.x-player.x,dy=c.y-player.y,d=Math.hypot(dx,dy);if(d>W.range||d<2)continue;
    const ad=Math.abs(angDiff(Math.atan2(dy,dx),player.a));if(ad>.5)continue;const sc=d*(1+ad*2);if(sc<bs){bs=sc;best=c}}
  if(best)player.a=Math.atan2(best.y-player.y,best.x-player.x);
  const n=W.pellets||1,sx=player.x+Math.cos(player.a)*9,sy=player.y+Math.sin(player.a)*9;
  for(let k=0;k<n;k++){
    const a=player.a+(n>1?rnd(-.13,.13):rnd(-.02,.02)),ca=Math.cos(a),sa=Math.sin(a);let ex=sx,ey=sy,done=false;
    for(let t=6;t<=W.range&&!done;t+=5){ex=sx+ca*t;ey=sy+sa*t;
      if(solid(ex,ey)){burst(ex,11,ey,2);done=true;break}
      for(const p of peds){if(p.down>0||Math.abs(p.x-ex)>7||Math.abs(p.y-ey)>7)continue;done=true;
        if(W.stun){p.down=240;p.stun=0;p.angry=0;pop(p.x,p.y,'지지직!','#74b9ff');if(p.boss)p.hp=0}
        else{p.hp-=W.dmg*(n>1?1.2:1.5);p.hit=10;if(p.hp<=0)koPed(p,true);else{p.flee=240;p.a=a}}
        burst(p.x,10,p.y,4);break}
      if(!done)for(const c of cars){if(c===player.car||Math.abs(c.x-ex)>c.w*.5||Math.abs(c.y-ey)>c.w*.5)continue;
        if(Math.hypot(c.x-ex,c.y-ey)<c.w*.45){done=true;if(!W.stun){c.hp-=W.dmg*4;if(c.police&&c.driver)crime(1)}burst(ex,8,ey,4);break}}
    }
    tracers.push({x1:sx,y1:11,z1:sy,x2:ex,y2:10,z2:ey,life:W.stun?8:5,col:W.stun?[.5,.8,1]:[1,.9,.5]});
  }
  burst(sx,11,sy,3);shake=Math.max(shake,W.stun?1:id==='shotgun'?6:3);
  if(W.stun){noise(.25,3000,'bandpass',.15);beep(900,.2,'sawtooth',.03)}else{noise(id==='shotgun'?.3:.16,id==='shotgun'?600:1400,'lowpass',.6);beep(id==='shotgun'?60:110,.12,'square',.08)}
  if(!W.stun){for(const p of peds)if(p.down<=0&&!p.angry&&dist(p,player)<300){p.flee=240;p.a=Math.atan2(p.y-player.y,p.x-player.x)}
    if(cars.some(c=>c.police&&c.driver&&c.hp>0&&dist(c,player)<450))crime(.6);else if(!mission||mission.type!=='thug')crime(.15)}
}
function combat(){
  if(player.comboT>0)player.comboT--;if(player.cd>0)player.cd--;if(player.aimT>0)player.aimT--;
  if(player.atk>0){player.atk--;if(player.atk===9&&!player.car)resolvePunch()}
  if((touch.atk||K('KeyJ'))&&!menuOpen){if(WEAP[player.cur].melee){if(player.atk<=3)attack()}else if(player.cd<=0&&(player.cur==='pistol'||touch.atk||K('KeyJ')))attack()}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.z+=s.vz;s.vy-=.18;if(--s.life<=0||s.y<0)sparks.splice(i,1)}
  for(let i=tracers.length-1;i>=0;i--)if(--tracers[i].life<=0)tracers.splice(i,1);
  const P=pp();
  for(let i=pickups.length-1;i>=0;i--){const k=pickups[i];if(--k.life<=0){pickups.splice(i,1);continue}
    if(!player.inside&&Math.hypot(k.x-P.x,k.y-P.y)<(player.car?26:16)){player.money+=k.v;pickups.splice(i,1);toast('+'+won(k.v),'#7CFC7C');beep(1320,.08,'triangle',.05);setTimeout(()=>beep(1760,.1,'triangle',.05),70)}}
  for(let i=pops.length-1;i>=0;i--)if(--pops[i].life<=0)pops.splice(i,1);
}
function crime(n){if(player.inside)return;heat=Math.min(5,heat+n);const w=Math.ceil(heat);calm=0;if(w>wanted){wanted=w;toast('수배 '+'★'.repeat(w),'#ffd34d');beep(880,.2,'square',.03)}}

const JOBS=[{n:'치킨 배달',i:'🍗'},{n:'떡볶이 배달',i:'🌶️'},{n:'택배 배송',i:'📦'},{n:'꽃 배달',i:'💐'},{n:'서류 배달',i:'📄'}];
let offers=[],mission=null;
function randSpot(){return cornerSpot(Math.floor(rnd(0,COLS)),pick([0,1,2,5,6,7]))}
function offerSpot(){const P=anchor();for(let k=0;k<40;k++){const p=randSpot(),d=Math.hypot(p.x-P.x,p.y-P.y);if(d>250&&d<1500&&!offers.some(o=>dist(o.pos,p)<250))return p}return randSpot()}
function refreshOffers(all){if(all)offers=[];const types=Object.keys(MT);while(offers.length<3){const av=types.filter(t=>!offers.some(o=>o.type===t));offers.push({type:pick(av),pos:offerSpot()})}}
function farSpot(min){const P=anchor();let d;for(let i=0;i<50;i++){d=randSpot();if(Math.hypot(d.x-P.x,d.y-P.y)>=min)break}return d}
function nearestIX(x,y){let c=clamp(Math.round(x/G),0,COLS),r=clamp(Math.round(y/G),0,ROWS);if(r===4)r=3;return {c,r}}
function startMission(type,mult=1){
  const P=anchor(),m={type,t:MT[type],mult,st:'go',time:0};
  if(type==='delivery'){m.job=pick(JOBS);m.dest=farSpot(900);const d=dist(m.dest,P);m.time=Math.round(d/2.6+700);m.reward=Math.round(d/100)*600+2500;
    m.txt=()=>`${m.job.i} ${m.job.n} → ${districtRaw(m.dest.x,m.dest.y)}`}
  if(type==='taxi'){m.dest=farSpot(1000);const d=dist(m.dest,P);m.time=Math.round(d/3.4+500);m.reward=Math.round(d/100)*800+3000;m.hp0=player.car?player.car.hp:100;
    m.txt=()=>`🚕 손님을 ${districtRaw(m.dest.x,m.dest.y)}까지 · 차 조심!`;toast('🧍 손님이 탔어요','#ffe066')}
  if(type==='thug'){const s=pedSpot(P.x,P.y,350,800)||{x:P.x+120,y:P.y};
    m.ped=makePed(s.x,s.y,{boss:true,keep:true,hp:8,look:Object.assign(makeLook(),{f:false,shirt:'#111',pants:'#151515',hs:4,cap:'#c0392b',h:1.12,skirt:false})});
    m.time=60*200;m.reward=7000;m.txt=()=>'👊 동네 불량배를 쓰러뜨려라'}
  if(type==='steal'){const s=roadSpot(P.x,P.y,600,1200)||roadSpot(P.x,P.y,300,1500)||{x:P.x+200,y:P.y,dir:0};
    m.car=makeCar('sports',s.x,s.y,s.dir,{ai:false,driver:false,keep:true,col:'#8e44ad'});m.st='get';
    const gs=doors.filter(d=>d.R.drive);m.garage=gs.sort((a,b)=>Math.hypot(b.ox-s.x,b.oy-s.y)-Math.hypot(a.ox-s.x,a.oy-s.y))[Math.min(1,gs.length-1)]||gs[0];
    m.time=60*240;m.reward=12000;m.txt=()=>m.st==='get'?'🔑 보라색 스포츠카를 찾아 타라':'🔧 정비소로 몰고 가라'}
  if(type==='race'){let {c,r}=nearestIX(P.x,P.y),dir=-1;m.cps=[];let len=0,px=P.x,py=P.y;
    for(let i=0;i<6;i++){const opts=[0,1,2,3].filter(d=>{if(d===(dir+2)%4)return false;const nc=c+DX[d]*2,nr=r+DY[d]*2;if(nc<0||nc>COLS||nr<0||nr>ROWS||nr===4||(r<=3&&nr>=5)||(r>=5&&nr<=3&&!BRIDGES[c]))return false;
        if(d%2===1){for(let k=1;k<=2;k++)if(r+DY[d]*k===4||!vRoad(c,(r+DY[d]*(k-.5))*G))return false}return true});
      if(!opts.length)break;dir=pick(opts);c+=DX[dir]*2;r+=DY[dir]*2;const cp={x:c*G,y:r*G};len+=Math.hypot(cp.x-px,cp.y-py);px=cp.x;py=cp.y;m.cps.push(cp)}
    m.ci=0;m.time=Math.round(len/5.6+240);m.reward=9000;m.txt=()=>`🏁 체크포인트 ${m.ci+1}/${m.cps.length}`}
  if(type==='collect'){m.items=[];for(let i=0;i<5;i++){const s=pedSpot(P.x,P.y,150,750);if(s)m.items.push({x:s.x,y:s.y,got:false})}
    m.time=60*160;m.reward=7000;m.txt=()=>`📮 택배 ${m.items.filter(q=>q.got).length}/${m.items.length} 수거`}
  if(type==='escape'){heat=Math.max(heat,2);wanted=Math.max(wanted,2);calm=0;m.reward=8000;m.time=0;m.txt=()=>'🚨 경찰을 따돌려라 (수배 해제)'}
  if(type==='chase'){const s=roadSpot(P.x,P.y,450,900)||roadSpot(P.x,P.y,300,1300)||{x:P.x+300,y:P.y,dir:0};
    m.car=makeCar('sedan',s.x,s.y,s.dir,{keep:true,flee:true,cruise:7.5,max:10,col:'#111'});m.time=60*180;m.reward=12000;m.txt=()=>`🚓 범인 차량을 박아서 멈춰라 (${Math.max(0,Math.round(m.car.hp))}%)`}
  m.reward=Math.round(m.reward*mult*econ.infl/100)*100;m.max=m.time;mission=m;
  toast(`${m.t.i} ${m.t.n} 시작! 보상 ${won(m.reward)}`,'#ffd34d');beep(660,.15,'triangle',.05);
}
function missionTarget(){
  const m=mission;if(!m){if(player.inside)return null;const P=anchor();let b=null,bd=1e9;for(const o of offers){const d=dist(o.pos,P);if(d<bd){bd=d;b=o.pos}}return b}
  if(m.type==='delivery'||m.type==='taxi')return m.dest;
  if(m.type==='thug')return m.ped;
  if(m.type==='steal')return m.st==='get'?m.car:{x:m.garage.ox,y:m.garage.oy};
  if(m.type==='race')return m.cps[m.ci];
  if(m.type==='collect'){const P=anchor();let b=null,bd=1e9;for(const q of m.items)if(!q.got){const d=dist(q,P);if(d<bd){bd=d;b=q}}return b}
  if(m.type==='chase')return m.car;
  return null;
}
function endMission(){const m=mission;if(!m)return;if(m.ped)m.ped.keep=false;if(m.car){m.car.keep=false;m.car.flee=false;m.car.cruise=rnd(3.5,4.5)}mission=null}
function completeMission(bonus=0){const m=mission,tot=m.reward+bonus;player.money+=tot;player.stats.missions++;player.stats.earned+=tot;
  toast(`✅ ${m.t.n} 완료! +${won(tot)}${bonus?' (보너스)':''}`,'#7CFC7C');beep(880,.12,'triangle',.05);setTimeout(()=>beep(1175,.2,'triangle',.05),120);
  endMission();save()}
function failMission(t){if(!mission)return;toast('❌ '+t,'#ff6b6b');beep(220,.3,'sawtooth',.03);endMission()}
function missionLogic(){
  const P=anchor();
  if(!mission&&!player.inside){for(const o of offers){if(dist(o.pos,P)>36)continue;
      if(MT[o.type].car&&!player.car){if(!(o.warn>frame)){o.warn=frame+300;toast('🚗 차가 필요한 미션이에요','#ffd34d')}continue}
      offers.splice(offers.indexOf(o),1);startMission(o.type);refreshOffers();break}}
  const m=mission;if(!m)return;
  if(m.time>0&&--m.time<=0)return failMission('시간 초과…');
  if(m.type==='delivery'&&dist(P,m.dest)<40)completeMission(Math.round(m.time/m.max*m.reward*.5/100)*100);
  if(m.type==='taxi'){if(!player.car)return failMission('손님이 내려버렸어요');if(player.car.hp<m.hp0-35)return failMission('손님이 겁먹고 내렸어요');
    if(dist(P,m.dest)<45)completeMission(Math.round(m.time/m.max*m.reward*.4/100)*100)}
  if(m.type==='thug'&&m.ped.down>0)completeMission();
  if(m.type==='steal'){if(m.car.hp<=0)return failMission('차가 망가졌어요');if(m.st==='get'&&player.car===m.car){m.st='go2';toast('🔧 정비소로 가져가세요','#a29bfe')}
    if(m.st==='go2'&&player.car===m.car&&Math.hypot(P.x-m.garage.ox,P.y-m.garage.oy)<50)completeMission()}
  if(m.type==='race'){const cp=m.cps[m.ci];if(cp&&dist(P,cp)<48){m.ci++;beep(990,.08,'triangle',.05);if(m.ci>=m.cps.length)completeMission(Math.round(m.time*8/100)*100)}}
  if(m.type==='collect'){for(const q of m.items)if(!q.got&&dist(q,P)<(player.car?26:18)){q.got=true;beep(1200,.08,'triangle',.05)}if(m.items.every(q=>q.got))completeMission()}
  if(m.type==='escape'&&wanted===0)completeMission();
  if(m.type==='chase'){if(m.car.hp<=0)completeMission();else if(dist(m.car,P)>2300)failMission('범인을 놓쳤어요')}
}

function horn(){
  if(!player.car)return;beep(330,.35,'sawtooth',.035);beep(415,.35,'sawtooth',.035);
  for(const p of peds)if(dist(p,player.car)<160){p.flee=120;p.a=Math.atan2(p.y-player.car.y,p.x-player.car.x)}
}
function toggleCar(){
  if(overlay)return;
  if(player.car){
    const c=player.car;
    for(const s of [-1,1]){const ex=c.x+Math.cos(c.a+s*Math.PI/2)*(c.h/2+12),ey=c.y+Math.sin(c.a+s*Math.PI/2)*(c.h/2+12);
      if(!solid(ex,ey)){player.x=ex;player.y=ey;player.car=null;c.driver=false;c.ai=false;return}}
    toast('여기서는 내릴 수 없어요');
  }else{
    let best=null,bd=50;
    for(const c of cars){if(c.boom)continue;const d=dist(c,player);if(d<bd){bd=d;best=c}}
    if(!best)return;
    if(best.driver){
      const s={x:best.x+Math.cos(best.a+Math.PI/2)*20,y:best.y+Math.sin(best.a+Math.PI/2)*20};
      const p=makePed(s.x,s.y);p.flee=240;p.a=Math.atan2(p.y-player.y,p.x-player.x);
      if(!best.flee)crime(best.police?2:1);toast(best.police?'경찰차를 탈취했다!':best.flee?'범인 차량 확보!':'차량 탈취!','#ff6b6b');
      if(best.flee){best.flee=false;best.hp=0}
    }
    best.driver=false;best.ai=false;best.vx=Math.cos(best.a)*best.v;best.vy=Math.sin(best.a)*best.v;
    player.car=best;beep(220,.08,'triangle',.05);
  }
}
function nearDoor(){if(player.car||player.inside)return null;let best=null,bd=20;
  for(const d of doors){if(d.R.drive||Math.abs(d.ox-player.x)>30||Math.abs(d.oy-player.y)>30)continue;const dd=Math.hypot(d.ox-player.x,d.oy-player.y);if(dd<bd){bd=dd;best=d}}return best}
function nearGarage(){const c=player.car;if(!c)return null;for(const d of doors)if(d.R.drive&&Math.hypot(d.ox+d.nx*22-c.x,d.oy+d.ny*22-c.y)<48)return d;return null}
function enterBuilding(d){
  if(d.role==='내 집'&&!player.house){toast('🏠 부동산에서 집을 먼저 사세요','#ffd34d');return}
  if(d.role==='홍대 클럽'){const fee=priceOf(5000,d);if(player.money<fee){toast('입장료 '+won(fee)+'가 필요해요','#ff6b6b');return}player.money-=fee;toast('🪩 입장료 -'+won(fee),'#ff7eb6')}
  const R=INTS[d.R.k];player.inside={door:d,R};player.x=R.cx;player.y=R.z1-26;player.a=-Math.PI/2;camYaw=-Math.PI/2;camSnap=true;
  beep(660,.06,'triangle',.04);setTimeout(()=>beep(880,.08,'triangle',.04),80);document.body.classList.add('inside');
}
function exitBuilding(){const d=player.inside.door;player.inside=null;player.x=d.ox+d.nx*3;player.y=d.oy+d.ny*3;player.a=Math.atan2(d.ny,d.nx);camYaw=player.a;camSnap=true;document.body.classList.remove('inside');beep(520,.06,'triangle',.04)}
function ctxAction(){
  if(menuOpen)return null;
  if(player.inside){const R=player.inside.R;if(dist(player,R.spot)<18)return {i:player.inside.door.R.i,t:R.k==='house'?'잠자기<br>메뉴':'이용<br>하기',f:()=>openShop(player.inside.door)};
    if(player.y>R.z1-30)return {i:'🚪',t:'나가기',f:exitBuilding};return null}
  if(player.car){const g=nearGarage();if(g&&Math.abs(player.car.v)<2)return {i:'🔧',t:'정비소<br>이용',f:()=>openShop(g)}}
  else{const d=nearDoor();if(d)return {i:d.R.i,t:'들어<br>가기',f:()=>enterBuilding(d)}}
  return {i:'🚗',t:'탑승<br>하차',f:toggleCar};
}
function doAction(){if(!started||overlay)return;if(menuOpen){closePanel();return}const a=ctxAction();if(a)a.f()}
function interiorLogic(){if(!player.inside)return;const R=player.inside.R;if(player.y>R.z1-10&&Math.abs(player.x-R.cx)<20)exitBuilding()}

function respawnAtDoor(d){if(player.car){player.car.driver=false;player.car=null}if(player.inside){player.inside=null;document.body.classList.remove('inside')}
  player.x=d.ox;player.y=d.oy;player.a=Math.atan2(d.ny,d.nx);camYaw=player.a;
  for(let i=cars.length-1;i>=0;i--)if(cars[i].police&&cars[i].driver)cars.splice(i,1);
  wanted=0;heat=0;bust=0;camSnap=true}
function wantedLogic(){
  const P=anchor();
  if(wanted>0&&!player.inside){
    let near=false,seen=false;
    for(const c of cars){if(!c.police||!c.driver||c.hp<=0)continue;const d=dist(c,P);if(d<650)seen=true;
      if(d<55&&(!player.car||Math.abs(player.car.v)<1.2))near=true}
    calm=seen?0:calm+1;
    if(calm>420){wanted--;heat=wanted;calm=0;toast(wanted?'수배 레벨 감소':'수배 해제! 따돌렸다','#7CFC7C')}
    bust=near?bust+1:Math.max(0,bust-2);
    if(bust>150){const fine=Math.max(1000,Math.round(player.money*.1/100)*100);player.money=Math.max(0,player.money-fine);
      const lost=player.ammo.pistol+player.ammo.shotgun>0;player.ammo.pistol=0;player.ammo.shotgun=0;
      overlay={t:'체포됨',s:`벌금 ${won(fine)}${lost?' · 탄약 압수':''}`,c:'#4da3ff',life:180};failMission('체포되어 미션 실패');
      respawnAtDoor(doors.find(d=>d.role==='경찰서'));beep(200,.6,'sawtooth',.04);save()}
  }else if(!player.inside){bust=0;calm=0}
  if(player.hp<=0){const fee=priceOf(2000,doors[0]);player.money=Math.max(0,player.money-fee);player.hp=player.maxHp*.6;player.hunger=Math.max(player.hunger,40);player.armor=0;
    overlay={t:'의식을 잃었다',s:'병원비 '+won(fee),c:'#ff5e5e',life:180};failMission('쓰러져서 미션 실패');
    respawnAtDoor(doors.find(d=>d.role==='병원'));save()}
}

function update(){
  frame++;
  if(!started)return;
  if(overlay){overlay.life--;if(overlay.life<=0)overlay=null;return}
  timeTick();
  if(player.car)drivePlayer(player.car);else walkPlayer();
  for(const c of cars){if(c===player.car)continue;
    if(c.police&&c.driver)policeAI(c);else if(c.ai&&c.driver&&c.hp>0)aiDrive(c);else coast(c);
    if(c.hp<35&&frame%4===0&&Math.abs(c.x-player.x)<1500)parts.push({x:c.x,y:c.y,vx:rnd(-.3,.3),vy:rnd(-.6,-.2),life:60,r:rnd(4,8),dark:c.hp<=0})}
  if(player.car&&player.car.hp<35&&frame%4===0)parts.push({x:player.car.x,y:player.car.y,vx:rnd(-.3,.3),vy:rnd(-.6,-.2),life:60,r:rnd(4,8),dark:player.car.hp<=0});
  combat();carCollisions();hits();updatePeds();needs();wantedLogic();missionLogic();interiorLogic();
  if(frame%15===0)populate();
  for(let i=skids.length-1;i>=0;i--)if(--skids[i].life<=0)skids.splice(i,1);if(skids.length>500)skids.splice(0,skids.length-500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.r+=.15;if(--p.life<=0)parts.splice(i,1)}
  if(parts.length>160)parts.splice(0,parts.length-160);
  for(let i=toasts.length-1;i>=0;i--)if(--toasts[i].life<=0)toasts.splice(i,1);
  shake*=.85;
  if(frame%1200===0)save();
}

const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH

#endif

function persp(fy,as,n,f){const t=1/Math.tan(fy/2);return [t/as,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]}
function look(e,t,u){let z=[e[0]-t[0],e[1]-t[1],e[2]-t[2]];let l=Math.hypot(...z);z=z.map(v=>v/l);
  let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]];l=Math.hypot(...x);x=x.map(v=>v/l);
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]}
function mul(a,b){const o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o}

  return {x:(cx/Math.abs(w)*.5+.5)*VW,y:(1-(cy/Math.abs(w)*.5+.5))*VH,w}}

const camP=[player.x,60,player.y+100];let fov=62;

  return Math.abs(dz*camF[0]-dx*camF[1])<=al*tanH+r*tanHc}
function updateCamera(){
  const P=pp(),car=player.car,ins=!!player.inside;
  if(car){camYaw=lerpAng(camYaw,car.a,camMode?.04:.07)}
  else if(player.moving&&Math.abs(angDiff(player.a,camYaw))<2.3)camYaw=lerpAng(camYaw,player.a,ins?.02:.03);
  const sp=car?Math.abs(car.v):0,fx=Math.cos(camYaw),fy=Math.sin(camYaw);
  let dist,h;
  if(ins){dist=58;h=84}
  else if(camMode===1){dist=car?170:120;h=car?330:240}
  else{dist=car?(car.type==='bus'?150:100)+sp*3.5:62;h=car?(car.type==='bus'?62:42)+sp*1.2:34}
  const want=[P.x-fx*dist,h,P.y-fy*dist];
  const k=camSnap?1:.13;camSnap=false;
  for(let i=0;i<3;i++)camP[i]+=(want[i]-camP[i])*k;
  const sh=shake*.6;
  eye[0]=camP[0]+(Math.random()-.5)*sh;eye[1]=camP[1]+(Math.random()-.5)*sh;eye[2]=camP[2]+(Math.random()-.5)*sh;
  fov+=((ins?58:camMode?55:60+sp*1.6)-fov)*.08;
  const tgt=[P.x+fx*(car?40:ins?6:20),car?8:ins?6:14,P.y+fy*(car?40:ins?6:20)];
  VP=mul(persp(fov*Math.PI/180,VW/VH,2,5200),look(eye,tgt,[0,1,0]));
  let ex=tgt[0]-eye[0],ez=tgt[2]-eye[2];const el=Math.hypot(ex,ez)||1;camF[0]=ex/el;camF[1]=ez/el;

}

      h+=btn({i:'💾',n:'지금 저장',d:'자동 저장도 돼요',p:0,act(){save();return '💾 저장됨'}});

panel.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){panelState.tab=t.dataset.tab;renderPanel();return}
  if(e.target.id==='closeP'){closePanel();return}
  const b=e.target.closest('[data-i]');if(!b||b.disabled)return;const it=curItems[+b.dataset.i];if(!it)return;
  const p=it.p||0;if(player.money<p){toast('돈이 부족해요','#ff6b6b');return}

function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function txt(t,x,y,col='#fff',font='bold 14px sans-serif',align='center',lw=4){ctx.font=font;ctx.textAlign=align;ctx.lineJoin='round';if(lw){ctx.lineWidth=lw;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(t,x,y)}ctx.fillStyle=col;ctx.fillText(t,x,y)}
function bar(x,y,w,v,col,ic){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x+16,y,w,8);ctx.fillStyle=col;ctx.fillRect(x+16,y,w*clamp(v,0,1),8);ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText(ic,x,y+8)}
const MM=.045,mm=document.createElement('canvas');mm.width=WW*MM;mm.height=WH*MM;
(function(){const m=mm.getContext('2d');m.fillStyle='#8f8a80';m.fillRect(0,0,mm.width,mm.height);
  for(const k in cells){const [c,r]=k.split(',').map(Number);if(cells[k].ground){m.fillStyle=cells[k].ground;m.fillRect(c*G*MM,r*G*MM,G*MM,G*MM)}}
  m.fillStyle='#3c78b0';m.fillRect(0,RIVER_T*MM,mm.width,(RIVER_B-RIVER_T)*MM);
  m.fillStyle='#2e2e33';
  for(let r=0;r<=ROWS;r++)if(r!==4)m.fillRect(0,(r*G-RW)*MM,mm.width,2*RW*MM);
  for(let c=0;c<=COLS;c++){if(BRIDGES[c])m.fillRect((c*G-RW)*MM,0,2*RW*MM,mm.height);else{m.fillRect((c*G-RW)*MM,0,2*RW*MM,(1200+RW)*MM);m.fillRect((c*G-RW)*MM,(2000-RW)*MM,2*RW*MM,(WH-2000+RW)*MM)}}
  m.fillStyle='rgba(60,60,70,.55)';for(const b of allB)m.fillRect(b.x*MM,b.y*MM,b.w*MM,b.h*MM);
  for(const d of doors){m.fillStyle=d.R.col;m.fillRect(d.x*MM-1.5,d.y*MM-1.5,3,3)}
})();
function drawHUD(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,VW,VH);
  const P=pp(),A=anchor(),mob=isTouch||VW<760,S=mob?.82:1,F=n=>`bold ${Math.round(n*S)}px sans-serif`,ins=player.inside;
  // 3D 라벨
  if(!ins)for(const l of labels){const lim=l.big?2200:l.near?240:900;if(Math.abs(l.x-P.x)>lim||Math.abs(l.z-P.y)>lim)continue;const d=Math.hypot(l.x-P.x,l.z-P.y);if(d>lim)continue;const p=project(l.x,l.y,l.z);if(p.w<=0)continue;
    if(p.x<-100||p.x>VW+100||p.y<-50||p.y>VH+50)continue;ctx.globalAlpha=clamp(1.4-d/lim,0,1);
    txt(l.t+(l.door&&player.biz.includes(l.door.id)?' (내 가게)':''),p.x,p.y,l.near?'#ffe9a8':'#fff',F(l.big?17:l.near?13:14),'center',4);ctx.globalAlpha=1}
  if(ins){const R=ins.R,p=project(R.spot.x,18,R.spot.y);if(p.w>0)txt(R.k==='house'?'🛏️ 침대':'🛎️ 카운터',p.x,p.y,'#ffd34d',F(15))}
  // 미션 아이콘
  const T=missionTarget();let onScr=false,tp=null;
  if(!ins){
    if(!mission)for(const o of offers){const p=project(o.pos.x,50+Math.sin(frame*.08)*4,o.pos.y);if(p.w>0&&p.x>0&&p.x<VW&&p.y>0&&p.y<VH){ctx.font=`${Math.round(clamp(2600/Math.max(p.w,1),18,40))}px sans-serif`;ctx.textAlign='center';ctx.fillText(MT[o.type].i,p.x,p.y);
      txt(MT[o.type].n,p.x,p.y+16,'#fff',F(12),'center',3)}}
    if(T){tp=project(T.x,40+Math.sin(frame*.08)*5,T.y);const td=Math.hypot(T.x-P.x,T.y-P.y);onScr=tp.w>0&&tp.x>30&&tp.x<VW-30&&tp.y>60&&tp.y<VH-30;
      if(onScr&&mission){ctx.font=`${Math.round(clamp(2400/Math.max(tp.w,1),18,40))}px sans-serif`;ctx.textAlign='center';ctx.fillText(mission.type==='delivery'||mission.type==='taxi'?'🏁':mission.t.i,tp.x,tp.y);txt((td*2.5/1000).toFixed(1)+'km',tp.x,tp.y+18,'#fff',F(12),'center',3)}
      if(!onScr){let dx=tp.x-VW/2,dy=tp.y-VH/2;if(tp.w<=0){dx=-dx;dy=-dy}if(tp.w<=0&&Math.abs(dy)<1)dy=1;
        const an=Math.atan2(dy,dx),m=Math.min((VW/2-44)/Math.abs(Math.cos(an)||1e-3),(VH/2-70)/Math.abs(Math.sin(an)||1e-3));
        const ex=VW/2+Math.cos(an)*m,ey=VH/2+Math.sin(an)*m;
        ctx.save();ctx.translate(ex,ey);ctx.rotate(an);ctx.fillStyle=mission?mission.t.c:'#ffd34d';ctx.strokeStyle='#000';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-10,-12);ctx.lineTo(-4,0);ctx.lineTo(-10,12);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
        txt((td*2.5/1000).toFixed(1)+'km',ex,ey+28,'#fff',F(12))}}}
  // 좌상단: 위치 · 시간 · 게이지
  const top=mob?22:30,hh=Math.floor(hourOf()),mn=Math.floor(econ.min%60),night=dayK()<.4;
  txt('📍 '+districtAt(A.x,A.y),14,top,'#fff',F(19),'left',5);
  txt(`${night?'🌙':'☀️'} ${String(hh).padStart(2,'0')}:${String(mn).padStart(2,'0')} · ${econ.day}일차`,14,top+20*S,'#dfe6ee',F(13),'left',4);
  let by=top+30*S;
  if(player.car){txt(Math.round(Math.abs(player.car.v)*18)+' km/h',14,by+12*S,'#fff',F(17),'left');by+=20*S;bar(14,by,104,player.car.hp/100,player.car.hp>50?'#4cd964':player.car.hp>0?'#ffb020':'#ff3b30','🚗');by+=12}
  bar(14,by,104,player.hp/player.maxHp,'#ff5e5e','❤️');by+=12;
  if(player.armor>0){bar(14,by,104,player.armor/100,'#4da3ff','🦺');by+=12}
  const hf=player.hunger<20&&frame%40<20;bar(14,by,104,player.hunger/100,hf?'#fff':'#ffa94d','🍔');by+=12;
  if(player.buff>0){txt('⚡ 이속 UP '+Math.ceil(player.buff/60)+'s',14,by+12,'#74b9ff',F(12),'left',3)}
  // 우상단: 돈 · 수배
  txt(won(player.money),VW-14,top+6,'#7CFC7C',F(27),'right',5);
  txt('🏦 '+won(player.bank),VW-14,top+24*S,'#c8f7c5',F(12),'right',3);
  for(let i=0;i<5;i++){const on=i<wanted,fl=on&&calm>0&&frame%30<15;txt('★',VW-18-(4-i)*25*S,top+48*S,on?(fl?'#fff':'#ffd34d'):'rgba(255,255,255,.3)',F(24),'right',3)}
  // 미션 배너
  let mt;if(mission){mt=mission.txt();if(mission.time>0)mt+=` ⏱${Math.ceil(mission.time/60)}초`;mt+=' · '+won(mission.reward)}
  else mt=ins?`${ins.door.R.i} ${ins.door.role} — 노란 원(카운터)에서 ${isTouch?'버튼':'F'}`:'🗺️ 색깔 기둥으로 가면 미션 시작 (📱 미션 탭)';
  ctx.font=F(15);const mw=Math.min(VW-20-(mob?250:0),ctx.measureText(mt).width+26),my=mob?6:12;
  ctx.fillStyle='rgba(0,0,0,.55)';rr(VW/2-mw/2,my,mw,30*S+2,15);ctx.fill();
  txt(mt,VW/2,my+21*S,mission&&mission.time>0&&mission.time<600&&frame%30<15?'#ff6b6b':'#fff',F(15),'center',0);
  // 무기 표시
  if(!player.car){const W=WEAP[player.cur],wx=VW/2,wy=mob?VH-12:VH-40;txt(W.i+' '+W.n+(W.melee?'':' '+player.ammo[player.cur]+'발'),wx,wy,'#fff',F(15),'center',4)}
  // 체포 게이지
  if(bust>0){const by2=mob?VH*.62:VH-90;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(VW/2-100,by2,200,14);ctx.fillStyle='#4da3ff';ctx.fillRect(VW/2-100,by2,200*bust/150,14);txt('체포 중... 도망쳐!',VW/2,by2-8,'#fff',F(15))}
  toasts.forEach((t,i)=>{ctx.globalAlpha=Math.min(1,t.life/30);txt(t.t,VW/2,(mob?VH*.28:96)+i*24,t.c,F(17));ctx.globalAlpha=1});
  for(const q of pops){const p=project(q.x,q.y+(42-q.life)*.35,q.z);if(p.w<=0)continue;const k=q.life>34?1+(q.life-34)*.09:1;
    ctx.globalAlpha=Math.min(1,q.life/12);txt(q.t,p.x,p.y,q.c,`bold ${Math.round(26*k*S)}px sans-serif`,'center',5);ctx.globalAlpha=1}
  if(!player.car&&player.comboT>0&&player.combo>1)txt(player.combo+' 콤보!',VW/2,VH*.64,'#ffd34d',F(20));
  // 미니맵
  if(!ins){const ms=mob?.55:1,mw2=mm.width*ms,mh2=mm.height*ms,mx=VW-mw2-12,mY=mob?top+58*S:VH-mh2-12,q=MM*ms;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(mx-3,mY-3,mw2+6,mh2+6);ctx.drawImage(mm,mx,mY,mw2,mh2);
    for(const c of cars){if(c.police&&c.driver&&c.hp>0){ctx.fillStyle=frame%20<10?'#f33':'#36f';ctx.fillRect(mx+c.x*q-2,mY+c.y*q-2,4,4)}else if(c.owned){ctx.fillStyle='#55efc4';ctx.fillRect(mx+c.x*q-2.5,mY+c.y*q-2.5,5,5)}}
    if(player.house&&HOME_DOOR){ctx.fillStyle='#55efc4';ctx.beginPath();ctx.arc(mx+HOME_DOOR.x*q,mY+HOME_DOOR.y*q,3.5,0,7);ctx.fill()}
    if(!mission)for(const o of offers){ctx.fillStyle=MT[o.type].c;ctx.beginPath();ctx.arc(mx+o.pos.x*q,mY+o.pos.y*q,3.5,0,7);ctx.fill()}
    if(T&&mission&&frame%30<20){ctx.fillStyle=mission.t.c;ctx.beginPath();ctx.arc(mx+T.x*q,mY+T.y*q,4.5,0,7);ctx.fill();ctx.strokeStyle='#000';ctx.stroke()}
    ctx.save();ctx.translate(mx+P.x*q,mY+P.y*q);ctx.rotate(player.car?player.car.a:player.a);ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-4);ctx.lineTo(-4,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
  // 행동 안내

    else if(!player.car&&!ins){let near=false;for(const c of cars)if(!c.boom&&dist(c,player)<50){near=true;break}if(near)txt(isTouch?'🚗 탑승 버튼을 누르세요':'F 키로 탑승',VW/2,VH*.74,'#ffd34d',F(17))}}

    txt(isTouch?'화면을 터치해서 시작 (가로 화면 추천)':'클릭하거나 아무 키나 눌러 시작',VW/2,VH/2+52,frame%60<40?'#fff':'#999',F(17))}

// ---------- 터치 컨트롤 ----------
(function(){
  const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid=null;
  function setK(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const R=r.width/2-10,d=Math.hypot(dx,dy);
    if(d>R){dx*=R/d;dy*=R/d}touch.x=dx/R;touch.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
  joy.addEventListener('pointerdown',e=>{e.preventDefault();if(!started)start();pid=e.pointerId;joy.setPointerCapture(pid);touch.active=true;setK(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===pid)setK(e)});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;touch.active=false;touch.x=touch.y=0;knob.style.transform=''};
  joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
  const B=(id,down,up)=>{const b=document.getElementById(id);
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!started){start();return}b.classList.add('on');down&&down()});
    const u=e=>{b.classList.remove('on');up&&up()};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('pointerleave',u);
    b.addEventListener('contextmenu',e=>e.preventDefault())};
  B('bF',()=>doAction());B('bH',()=>horn());B('bCam',()=>{camMode=1-camMode});B('bW',()=>switchWeapon());
  B('bAtk',()=>{touch.atk=true;attack()},()=>touch.atk=false);
  B('bHB',()=>touch.hb=true,()=>touch.hb=false);B('bR',()=>touch.run=true,()=>touch.run=false);
  document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('#panel'))e.preventDefault()},{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
})();
const bFi=document.getElementById('bFi'),bFt=document.getElementById('bFt'),bAtkI=document.querySelector('#bAtk span');let lastCtx='',lastW='';
function uiTick(){
  const a=ctxAction()||{i:'✖️',t:'닫기'};const key=a.i+a.t;if(key!==lastCtx){lastCtx=key;bFi.textContent=a.i;bFt.innerHTML=a.t}
  const w=WEAP[player.cur].i;if(w!==lastW){lastW=w;bAtkI.textContent=w}
  const ic=!!player.car;if(ic!==inCarUI){inCarUI=ic;document.body.classList.toggle('incar',ic)}
}

let last=performance.now(),acc=0,inCarUI=false;
function loop(t){const dt=Math.min(100,t-last);last=t;acc+=dt;let n=0;
  while(acc>=16.67&&n<5){update();acc-=16.67;n++}if(n>=5)acc=0;
  if(n){render3D();drawHUD();if(frame%6===0)uiTick()}
  perfTick(dt,n>0);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
</script>
