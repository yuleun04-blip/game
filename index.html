<!DOCTYPE html>

<style>

#bW{position:fixed;right:calc(178px + env(safe-area-inset-right));bottom:calc(176px + env(safe-area-inset-bottom));width:52px;height:52px;font-size:10px}

.incar #bR{opacity:.35}.incar #bHB .j,body:not(.incar) #bHB .h{display:none}
#mapBtn{position:fixed;left:calc(10px + env(safe-area-inset-left));top:calc(176px + env(safe-area-inset-top));width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.45);color:#fff;font-size:22px;padding:0;touch-action:none;z-index:5}

<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<canvas id="hud"></canvas>
<div id="help">WASD 이동 · J/클릭 공격 · Q 무기 교체 · F 탑승/들어가기/이용 · M 휴대폰 · C 지도 · V 시점 · Space 점프(걸을 때)·핸드브레이크(운전) · Shift 달리기 · H 경적</div>
<button id="menuBtn">📱</button><button id="mapBtn">🗺️</button>
<div id="touch">
  <button id="bAtk"><span>👊</span>공격</button>
  <button id="bW"><span>🔄</span>무기</button>
  <div id="joy"><div id="knob"></div></div>

  </div>
</div>
<div id="panel"></div>
<div id="mapUI"><canvas id="mapc"></canvas><div id="mapBar"><button data-m="close">✕ 닫기</button><button data-m="in">＋</button><button data-m="out">－</button><button data-m="me">📍 내 위치</button><button data-m="clear">🧹 목적지 지우기</button><span>지도를 누르면 목적지 표시 · 드래그로 이동</span></div></div>
<script>
// ===== 서울 스트리트 3D (WebGL, 외부 라이브러리 없음) =====
const glc=document.getElementById('gl'),hud=document.getElementById('hud'),ctx=hud.getContext('2d');
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(isTouch)document.body.classList.add('touch');
let VW=innerWidth,VH=innerHeight,DPR=1,GDPR=1;
let camYaw=0,camMode=0,camSnap=true,camPitch=0,manualT=-9999,mouseAtk=false;
const touch={active:false,x:0,y:0,hb:false,run:false,atk:false};
function inputVec(){
  if(touch.active)return {x:touch.x,y:touch.y};
  return {x:K('KeyD','ArrowRight')-K('KeyA','ArrowLeft'),y:K('KeyS','ArrowDown')-K('KeyW','ArrowUp')};
}
const HB=()=>K('Space')||touch.hb;
const RUN=()=>K('ShiftLeft','ShiftRight')||touch.run;
const keys={};const K=(...a)=>a.some(k=>keys[k]);

// ===== 월드 규격: 1m ≈ 8.6 유닛 · 사람 키 ≈ 15 · 한 층 ≈ 27.5 =====
const G=400,RW=30,COLS=24,ROWS=16,WW=COLS*G,WH=ROWS*G,FLOOR=14,PSC=.47,PSC_IN=.85,CS=.5;
const DX=[1,0,-1,0],DY=[0,1,0,-1],DIRA=[0,Math.PI/2,Math.PI,-Math.PI/2];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};
const lerpAng=(a,b,t)=>a+angDiff(b,a)*t;
const laneOff=d=>[15,-15,-15,15][d];
const won=n=>'₩'+Math.round(n).toLocaleString();

// =====================================================================
// ---------- 월드: 실제 서울·경기 지리 (휘어진 한강 · 여의도 · 산 · 동네마다 다른 도로망) ----------
// =====================================================================
const IX0=20000;
let liftF=null,LY=0;
const lerp=(a,b,t)=>a+(b-a)*t;
function smooth(a,b,v){const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)}
let _wsd=20261011;const wrnd=()=>(_wsd=(_wsd*16807)%2147483647)/2147483647,wr=(a,b)=>a+wrnd()*(b-a),wpick=a=>a[Math.floor(wrnd()*a.length)];
function hash2(i,j){let h=(Math.imul(i|0,374761393)+Math.imul(j|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=hash2(i,j),b=hash2(i+1,j),c=hash2(i,j+1),d=hash2(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){return vnoise(x,y)*.55+vnoise(x*2.1+5.2,y*2.1+1.3)*.28+vnoise(x*4.3+9.1,y*4.3+3.7)*.17}
// ---------- 한강 ----------
const RIVER_PTS=[[-1900,2280],[-600,2350],[0,2420],[900,2560],[1800,2720],[2600,2880],[3300,3020],[4000,3150],[4700,3230],[5300,3160],[5800,3000],[6400,2860],[7000,2960],[7500,3120],[8100,2960],[8800,2740],[9600,2580],[11500,2380]];
function riverZ(x){const P=RIVER_PTS;let i=0;while(i<P.length-2&&x>P[i+1][0])i++;const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)],t=clamp((x-p1[0])/(p2[0]-p1[0]),0,1),t2=t*t,t3=t2*t;
  return .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)}
function riverHW(x){return 112+22*Math.sin(x*.0013+1)+150*Math.exp(-(((x-3550)/520)**2))+Math.max(0,1500-x)*.07}
const YEO={x:3550,rx:560,rz:110,off:42};
function islandK(x,y){const u=(x-YEO.x)/YEO.rx,v=(y-riverZ(x)-YEO.off)/YEO.rz;return u*u+v*v}
const onIsland=(x,y)=>islandK(x,y)<1;
const WL=-19,XW_OFF=300;
function riverD(x,y){return Math.abs(y-riverZ(x))-riverHW(x)}
function isWaterRaw(x,y){return riverD(x,y)<-4&&islandK(x,y)>=1.12}
// ---------- 산 (x, z, 반경, 높이) ----------
const MTNS=[[4100,420,950,300,'북한산'],[5350,230,650,230,'도봉산'],[7400,300,650,210,'수락산'],[7750,1000,420,140,'불암산'],[4750,960,380,125,'북악산'],[4230,1420,330,110,'인왕산'],
  [3850,1620,300,70,'안산'],[5250,2380,400,160,'남산'],[8350,2150,450,125,'아차산'],[8000,1680,380,105,'용마산'],[4250,5650,950,290,'관악산'],[3600,5350,500,165,'삼성산'],
  [5450,4950,480,135,'우면산'],[6100,5900,850,270,'청계산'],[6900,5080,420,110,'대모산'],[8950,5050,900,250,'남한산성'],[9450,4000,620,200,'검단산'],[800,780,450,95,'고봉산'],
  [2700,6250,600,180,'수리산'],[5200,6500,700,210,'광교산'],[7250,6250,450,130,'불곡산'],[9500,1750,700,225,'예봉산'],[2600,650,500,140,'노고산']];
function mtnH(x,y){let h=0;for(const m of MTNS){const dx=x-m[0],dy=y-m[1],R2=m[2]*2.1;if(dx>R2||dx<-R2||dy>R2||dy<-R2)continue;const d2=(dx*dx+dy*dy)/(m[2]*m[2]);h+=m[3]*Math.exp(-d2*1.9)*(.78+.44*vnoise(x*.0045+m[0]*.01,y*.0045))}return h}
function landH(x,y){return (fbm(x*.0008+3.1,y*.0008+7.7)-.47)*78+(vnoise(x*.004,y*.004)-.5)*15+mtnH(x,y)}
const AIR={c0:0,c1:5,r0:10,r1:14},AX0=0,AX1=2000,AY0=4000,AY1=5600;
const RWY={x0:160,x1:1840,z:4800,hw:50},TWY={z:4500,hw:26};
const inAirport=(x,y)=>x>AX0+RW&&x<AX1-RW&&y>AY0+RW&&y<AY1-RW;
const AIRD=(x,y)=>Math.hypot(Math.max(AX0-x,0,x-AX1),Math.max(AY0-60-y,0,y-AY1));
// 땅 높이: 강바닥 -24 · 둔치 -15 · 둑 · 도시 언덕 · 산
function groundH(x,y){if(x>IX0-300)return 0;
  const rz=riverZ(x),hw=riverHW(x),ad=Math.abs(y-rz);
  if(ad<hw+10){const ik=islandK(x,y);if(ik<1.35)return ik<1?-12+3*Math.max(0,.55-ik):lerp(-12,-24,smooth(1,1.35,ik))}
  if(ad<hw)return -24+9*smooth(hw-40,hw,ad);
  const d=ad-hw;if(d<165)return d<25?-15.6+d*.024:-15;
  const sa=smooth(0,560,AIRD(x,y)),L=(landH(x,y)*smooth(260,950,d)-2)*sa;
  if(d<262)return -15+(L+15)*smooth(165,262,d);
  return L}
// ---------- 동네 (이름, x, z, 종류) ----------
const DIST=[['파주',600,250,'rural'],['일산',900,1250,'new'],['고양',2050,850,'resi'],['은평',3050,1150,'resi'],['북한산',4050,480,'mtn'],['평창동',4350,1080,'resi'],['도봉',5700,800,'resi'],['의정부',6350,250,'new'],
  ['노원',7000,900,'apt'],['수락산',7550,280,'mtn'],['남양주',8900,950,'rural'],['김포',700,2050,'new'],['상암',2400,2250,'new'],['홍대',3350,2150,'mid'],['신촌',3900,1880,'mid'],['종로',4800,1650,'core'],
  ['명동',5000,2060,'core'],['성북',5650,1250,'resi'],['동대문',5750,1850,'core'],['왕십리',6350,2150,'mid'],['청량리',6600,1600,'mid'],['구리',8750,1950,'resi'],['광진',7600,2450,'resi'],['성수',6750,2600,'ind'],
  ['이태원',5000,2750,'mid'],['용산',4450,2650,'mid'],['마포',3600,2620,'resi'],['남산',5250,2380,'park'],['여의도',3550,3140,'core'],['강서',1500,3350,'resi'],['김포공항',1000,4700,'air'],['목동',2450,3650,'apt'],
  ['영등포',3300,3620,'mid'],['노량진',4100,3650,'resi'],['반포',5050,3650,'apt'],['압구정',6000,3330,'apt'],['강남',5800,4120,'gangnam'],['삼성',6500,3850,'gangnam'],['잠실',7200,3530,'apt'],['송파',7600,4250,'apt'],
  ['강동',8600,3350,'resi'],['하남',9300,3800,'new'],['부천',700,5000,'resi'],['구로',2400,4400,'ind'],['광명',1900,5450,'new'],['사당',4550,4550,'resi'],['서초',5200,4300,'core'],['양재',5800,4900,'mid'],
  ['개포',6400,4650,'apt'],['수서',7100,4800,'mid'],['위례',7900,5000,'new'],['관악산',4250,5650,'mtn'],['안양',3200,5700,'resi'],['과천',5000,5450,'new'],['청계산',6100,5900,'mtn'],['성남',7900,5750,'resi'],
  ['분당',7050,6150,'new'],['판교',6300,6250,'gangnam'],['남한산성',8950,5050,'mtn'],['수원',4300,6350,'resi'],['검단산',9450,4050,'mtn']];
const DTYPE={
  core:{sp:[230,290],ang:.35,drop:.08,cls:'loc',b:{w:[38,90],d:[38,85],fl:[6,22],tall:.18,glass:.35,sign:.38,set:[3,8]}},
  gangnam:{sp:[310,230],ang:.05,drop:.04,cls:'loc',b:{w:[60,110],d:[50,90],fl:[14,36],tall:.3,glass:.72,sign:.25,set:[6,14]}},
  mid:{sp:[200,250],ang:.5,drop:.12,cls:'loc',b:{w:[30,60],d:[30,58],fl:[3,9],tall:.04,glass:.05,sign:.55,set:[2,5]}},
  resi:{sp:[150,190],ang:.6,drop:.18,cls:'lane',wavy:1,b:{w:[24,40],d:[24,38],fl:[2,5],tall:0,glass:0,sign:.14,set:[2,4],brick:1}},
  apt:{sp:[400,440],ang:.3,drop:.02,cls:'loc',b:{apt:1,w:[110,150],d:[36,42],fl:[15,30],set:[26,44],sign:.0}},
  new:{sp:[380,360],ang:.25,drop:.02,cls:'loc',b:{apt:.6,w:[50,90],d:[40,70],fl:[5,12],set:[10,20],sign:.4,glass:.25}},
  ind:{sp:[300,330],ang:.4,drop:.1,cls:'loc',b:{w:[70,140],d:[50,100],fl:[1,3],tall:0,glass:0,sign:.06,set:[6,14],fac:1}},
  rural:{none:1,rural:1},mtn:{none:1},park:{none:1},air:{none:1}};
const DIDX=DIST.map((D,i)=>{const T=DTYPE[D[3]];return {i,n:D[0],x:D[1],y:D[2],t:D[3],T,north:D[2]<riverZ(D[1]),ang:(hash2(i,7)-.5)*2*(T.ang||0)+(D[3]==='gangnam'?-.24:0),
  sx:T.sp?lerp(T.sp[0],T.sp[1],hash2(i,3)):0,sy:T.sp?lerp(T.sp[1],T.sp[0],hash2(i,5)):0}});
const DM_S=50,DM_W=Math.ceil(WW/DM_S),DM_H=Math.ceil(WH/DM_S),DMAP=new Uint8Array(DM_W*DM_H);
for(let j=0;j<DM_H;j++)for(let i=0;i<DM_W;i++){const x=i*DM_S+25,y=j*DM_S+25,north=y<riverZ(x);let b=0,bd=1e18;
  if(onIsland(x,y)){DMAP[j*DM_W+i]=DIST.findIndex(D=>D[0]==='여의도');continue}

        burst(p.x,10,p.y,4);break}

function energyTick(){
  if(menuOpen||player.inside&&player.jail&&false)return;
  const drain=.0028*(player.spd>3?1.5:1)*(player.car||player.plane?.8:1)*(1-.05*player.sk.run);
  player.energy=Math.max(0,player.energy-drain);
  if(player.energy<=0){player.hp-=.03;hurtBy('과로 (잠을 안 잠)');if(frame%900===0){toast('💤 너무 졸려요… 체력이 깎이고 있어요! (집·모텔·찜질방·공원 벤치)','#a29bfe');shake=Math.max(shake,4)}}
  else if(player.energy<20&&frame%2400===0)toast('💤 졸려요. 잠을 자야 해요','#a29bfe');
}

function flyPlayer(p){
  const I=menuOpen?{x:0,y:0}:inputVec(),T=p.T;
  if(p.alt<=0){
    const up=I.y<-.25,dn=I.y>.25;
    if(up)p.v+=T.acc*(1-p.v/T.max*.45);if(dn)p.v=Math.max(0,p.v-.15);if(!up&&!dn)p.v*=.994;if(HB())p.v*=.95;p.v=clamp(p.v,0,T.max);
    p.a+=clamp(I.x,-1,1)*T.turn*1.4*Math.min(1,p.v/2+.25);p.pitch*=.8;p.roll*=.85;
    if(p.v>=T.take&&up){p.alt=.6;p.pitch=.14;toast('🛫 이륙!','#7CFC7C');beep(200,.6,'sawtooth',.03)}
    const nx=p.x+Math.cos(p.a)*(T.L*.5),ny=p.y+Math.sin(p.a)*(T.L*.5);
    if(solid(nx,ny)){if(p.v>4)return crashPlane(p,'건물에 충돌했다!');p.v=0;return}
    for(const q of peds)if(q.down<=0&&Math.abs(q.x-p.x)<T.L*.4&&Math.abs(q.y-p.y)<T.L*.4&&p.v>1.5){q.down=300;q.hp=0}
  }else{
    const thr=RUN()?1:HB()?-1:0,tv=T.max*(.72+.28*thr)*(thr<0?.75:1);p.v+=(tv-p.v)*.012;
    const tp=clamp(-I.y,-1,1)*.42;p.pitch+=(tp-p.pitch)*.05;
    const tr=clamp(I.x,-1,1)*.75;p.roll+=(tr-p.roll)*.06;p.a+=p.roll*T.turn*1.15;
    if(p.v<T.take*.85){p.pitch=Math.max(p.pitch-.012,-.7);if(frame%60===0)toast('⚠️ 실속! 속도를 올리세요 (부스트)','#ff6b6b')}
    p.alt=Math.min(1800,p.alt+Math.sin(p.pitch)*p.v);
    const P0=Math.hypot(p.x-WW/2,p.y-WH/2);if(p.x<-900||p.x>WW+900||p.y<-900||p.y>WH+900){p.a=lerpAng(p.a,Math.atan2(WH/2-p.y,WW/2-p.x),.03);if(frame%120===0)toast('↩️ 공역 경계 — 자동 선회','#ffd34d')}
    if(p.alt<=0){const vs=Math.sin(p.pitch)*p.v,flat=!isWater(p.x,p.y)&&heightAt(p.x,p.y)<1;
      if(vs<-1.6||!flat||Math.abs(p.roll)>.5)return crashPlane(p,flat?'착륙 실패! 너무 세게 내려왔다':'착륙할 수 없는 곳이다!');
      p.alt=0;p.pitch=0;p.roll=0;toast(inAirport(p.x,p.y)?'🛬 활주로 착륙 성공!':'🛬 비상 착륙 성공!','#7CFC7C');gainXP(p.type==='jet'?60:25,'착륙')}
    else if(p.alt<heightAt(p.x,p.y)-1)return crashPlane(p,'건물에 충돌했다!');
  }
  const hv=p.v*Math.cos(p.pitch);p.x+=Math.cos(p.a)*hv;p.y+=Math.sin(p.a)*hv;p.prop+=p.v*.35+.25;
}

function planeAI(){

  if(p.alt<=0){p.v=Math.min(p.T.max,p.v+.04);if(p.v>=p.T.take){p.alt=.5;p.pitch=.16}}
  else{p.pitch+=(.18-p.pitch)*.02;p.alt+=Math.sin(p.pitch)*p.v;if(p.alt>420)p.pitch*=.95}
  p.x+=Math.cos(p.a)*p.v*Math.cos(p.pitch);p.y+=Math.sin(p.a)*p.v*Math.cos(p.pitch);p.prop+=1;
  if(p.x>WW+1500){planes.splice(planes.indexOf(p),1);ambJet=null}
}

function pedGreet(p){const h=hourOf();if(p.cop)return wanted?'멈춰! 경찰이다!':player.rep<-40?'당신… 요주의 인물 명단에서 본 얼굴인데.':pick(['순찰 중입니다. 별일 없으시죠?','안전한 하루 되세요.']);if(player.rep<-45)return pick(['…말 걸지 마세요.','(눈을 피한다)','저리 가요!','신고할 거예요…']);if(player.rep>55)return pick(['어머, 그 착한 분이시죠?','동네 영웅이시네요!','늘 고마워요!']);if(wanted>=2)return pick(['히익… 저, 저는 아무것도 못 봤어요!','사, 살려주세요…']);if(rainK>.4)return pick(['비가 엄청 오네요.','우산 안 가져오셨어요?']);

function pickpocket(p,ch){closePanel();p.idle=0;
  if(Math.random()<ch){const loot=Math.round(rnd(500,4000)*(1+.2*player.sk.stealth)/100)*100;player.money+=loot;p.robbed=1;player.stats.steals++;gainXP(12,'소매치기');noise(.05,4000,'highpass',.05);return `🤏 지갑 슬쩍! +${won(loot)}`}

  for(const s of econ.stocks){const ch=s.p/s.open-1,own=player.stocks[s.id]||0,p=Math.round(s.p),buy=Math.ceil(p*(1+fee));
    h+=`<div class="row"><span>${s.n} <small style="color:#99a">보유 ${own}주</small></span><b class="${ch>=0?'up':'dn'}">${won(p)} ${ch>=0?'▲':'▼'}${Math.abs(ch*100).toFixed(1)}%</b></div>`;
    h+=`<div style="display:flex;gap:6px">`+[1,10].map(q=>btn({i:'',n:`${q}주 사기`,d:'',p:buy*q,act(){player.stocks[s.id]=own+q;return `📈 ${s.n} ${q}주 매수`}},'sm')).join('')+
      btn({i:'',n:'전부 팔기',d:'',p:0,pl:own?'+'+won(own*p*(1-fee)):'-',dis:!own,act(){player.money+=Math.floor(own*p*(1-fee));player.stocks[s.id]=0;return `📉 ${s.n} 매도 +${won(own*p*(1-fee))}`}},'sm')+`</div>`}

  return h;
}

  if(player.trans){const t=player.trans.t,a=1-Math.abs(t-24)/24;ctx.fillStyle=`rgba(0,0,0,${clamp(a*1.15,0,1)})`;ctx.fillRect(0,0,VW,VH);
    const T=player.trans,lab=T.label||(T.ride?'🚇 열차에 탑승…':T.arrive?'🚇 도착! 승강장에 내려요':player.inside&&player.inside.R.L[T.to]?`${T.to>T.from?'⬆️':'⬇️'} ${player.inside.R.L[T.to].name}(으)로 이동 중…`:'');txt(lab,VW/2,VH/2,'#fff',F(22))}
  if(mission&&mission.type==='race'&&mission.st==='count'){const n=Math.ceil(mission.cd/60);txt(n>0?String(n):'GO!',VW/2,VH*.4,'#ffd34d',F(80),'center',8)}
  if(resultCard){const c=resultCard,a=Math.min(1,c.life/30,(330-c.life)/15+.01),w=Math.min(320,VW-40),h=58+c.lines.length*20,x=VW/2-w/2,y=VH*.3;ctx.globalAlpha=a;
    ctx.fillStyle='rgba(12,14,22,.88)';rr(x,y,w,h,14);ctx.fill();const gc={S:'#ffd32a',A:'#7bed9f',B:'#70a1ff',C:'#ccc'}[c.grade]||'#ffd32a';
    txt(c.grade,x+34,y+44,gc,F(42),'center',5);txt(c.t,x+66,y+26,'#fff',F(16),'left',0);c.lines.forEach((l,i)=>txt(l,x+66,y+48+i*20,'#cfd6e4',F(13),'left',0));ctx.globalAlpha=1}
  if(!isTouch&&started&&!menuOpen&&!overlay){if(document.pointerLockElement===glc){if(!player.car){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(VW/2,VH*.45,5,0,7);ctx.stroke()}}
    else txt('🖱️ 화면을 클릭하면 마우스로 시점 회전 (Esc로 해제)',VW/2,VH-66,'rgba(255,255,255,.75)',F(13),'center',3)}
  if(overlay){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,VW,VH);txt(overlay.t,VW/2,VH/2,overlay.c,F(56),'center',8);txt(overlay.s,VW/2,VH/2+44,'#fff',F(22));if(overlay.s2)txt(overlay.s2,VW/2,VH/2+74,'#ccc',F(16))}
  if(!started){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,VW,VH);
    txt('서울 스트리트 3D',VW/2,VH/2-58,'#ffd34d',`bold ${Math.min(60,VW/9)|0}px sans-serif`,'center',8);
    txt('오픈월드 서울 · 8가지 미션 · 가게 · 무기 · 주식 · 내 집',VW/2,VH/2-14,'#fff',F(18));
    txt(loaded?`💾 저장된 게임: ${econ.day}일차 · ${won(player.money)}`:'처음 오셨네요! 배고픔을 채우고 돈을 벌어 보세요',VW/2,VH/2+16,'#c8f7c5',F(15));
    txt(isTouch?'화면을 터치해서 시작 (가로 화면 추천)':'클릭하거나 아무 키나 눌러 시작',VW/2,VH/2+52,frame%60<40?'#fff':'#999',F(17))}
}

// ---------- 시점 조작: 마우스(포인터 고정) · 터치 드래그 ----------
let lookId=null,lookX=0,lookY=0;
glc.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){if(!started)start();if(menuOpen)return;
    if(document.pointerLockElement!==glc){try{const r=glc.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(_){}}
    else if(e.button===0){mouseAtk=true;attack()}return}
  if(!started||menuOpen)return;if(lookId===null){lookId=e.pointerId;lookX=e.clientX;lookY=e.clientY}});
addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lookX,dy=e.clientY-lookY;lookX=e.clientX;lookY=e.clientY;
  camYaw+=dx*.0065*settings.cam;camPitch=clamp(camPitch+dy*.004*settings.cam,-.35,.9);manualT=frame});
const lookEnd=e=>{if(e.pointerId===lookId)lookId=null};addEventListener('pointerup',lookEnd);addEventListener('pointercancel',lookEnd);
addEventListener('mouseup',e=>{if(e.button===0)mouseAtk=false});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===glc&&!menuOpen){camYaw+=e.movementX*.0028*settings.cam;camPitch=clamp(camPitch+e.movementY*.0022*settings.cam,-.35,.9);manualT=frame}});
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==glc)mouseAtk=false});

// ---------- 터치 컨트롤 ----------
(function(){
  const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid=null;
  function setK(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const R=r.width/2-10,d=Math.hypot(dx,dy);
    if(d>R){dx*=R/d;dy*=R/d}touch.x=dx/R;touch.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
  joy.addEventListener('pointerdown',e=>{e.preventDefault();if(!started)start();pid=e.pointerId;joy.setPointerCapture(pid);touch.active=true;setK(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===pid)setK(e)});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;touch.active=false;touch.x=touch.y=0;knob.style.transform=''};
  joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
  const B=(id,down,up)=>{const b=document.getElementById(id);
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!started){start();return}b.classList.add('on');down&&down()});
    const u=e=>{b.classList.remove('on');up&&up()};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('pointerleave',u);
    b.addEventListener('contextmenu',e=>e.preventDefault())};
  B('bF',()=>doAction());B('bH',()=>horn());B('bCam',()=>{camMode=1-camMode});B('bW',()=>switchWeapon());
  B('bAtk',()=>{touch.atk=true;attack()},()=>touch.atk=false);
  B('bHB',()=>touch.hb=true,()=>touch.hb=false);B('bR',()=>touch.run=true,()=>touch.run=false);
  document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('#panel'))e.preventDefault()},{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
})();
const bFi=document.getElementById('bFi'),bFt=document.getElementById('bFt'),bAtkI=document.querySelector('#bAtk span');let lastCtx='',lastW='';
function uiTick(){
  const a=ctxAction()||{i:'✖️',t:'닫기'};const key=a.i+a.t;if(key!==lastCtx){lastCtx=key;bFi.textContent=a.i;bFt.innerHTML=a.t}
  const w=WEAP[player.cur].i;if(w!==lastW){lastW=w;bAtkI.textContent=w}
  const ic=!!(player.car||player.plane);if(ic!==inCarUI){inCarUI=ic;document.body.classList.toggle('incar',ic)}
}

let last=performance.now(),acc=0,inCarUI=false;
function loop(t){const dt=Math.min(100,t-last);last=t;acc+=dt;let n=0;
  while(acc>=16.67&&n<5){update();acc-=16.67;n++}if(n>=5)acc=0;
  if(n){render3D();drawHUD();if(mapOpen&&frame%8===0)drawMap();if(frame%6===0)uiTick()}
  perfTick(dt,n>0);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
</script>
