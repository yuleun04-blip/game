<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>서울 스트리트 3D</title>
<style>
html,body{margin:0;height:100%;background:#9cc8ec;overflow:hidden;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%}
#hud{pointer-events:none}
#help{position:fixed;left:10px;bottom:10px;color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.6;pointer-events:none}
#touch{display:none}
.touch #touch{display:block}
.touch #help{display:none}
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.45);touch-action:none}
#knob{position:absolute;left:43px;top:43px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#btns{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,62px);gap:10px;align-items:end}
#btns button{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);color:#fff;font-size:12px;font-weight:bold;line-height:1.15;touch-action:none;padding:0;font-family:inherit}
#btns button.on{background:rgba(255,211,77,.55)}
#btns button span{font-size:20px;display:block}
#bF{grid-column:3;grid-row:1/3;height:134px!important;border-radius:31px!important;background:rgba(46,204,113,.4)!important}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="help">WASD/방향키 이동 · F 탑승/하차 · Space 핸드브레이크 · Shift 달리기 · H 경적 · C 시점 전환</div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div id="btns">
    <button id="bCam"><span>🎥</span>시점</button>
    <button id="bH"><span>📢</span>경적</button>
    <button id="bF"><span>🚗</span>탑승<br>하차</button>
    <button id="bR"><span>🏃</span>달리기</button>
    <button id="bHB"><span>🛑</span>핸브</button>
  </div>
</div>
<script>
// ===== 서울 스트리트 3D (WebGL, 외부 라이브러리 없음) =====
const glc=document.getElementById('gl'),hud=document.getElementById('hud'),ctx=hud.getContext('2d');
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(isTouch)document.body.classList.add('touch');
let VW=innerWidth,VH=innerHeight,DPR=1,GDPR=1;
let camYaw=0,camMode=0,camSnap=true;
// ---- 입력 (키보드 + 터치) ----
const touch={active:false,x:0,y:0,hb:false,run:false};
function inputVec(){
  if(touch.active)return {x:touch.x,y:touch.y};
  return {x:K('KeyD','ArrowRight')-K('KeyA','ArrowLeft'),y:K('KeyS','ArrowDown')-K('KeyW','ArrowUp')};
}
const HB=()=>K('Space')||touch.hb;
const RUN=()=>K('ShiftLeft','ShiftRight')||touch.run;
</script>
<script>
const G=400,RW=30,COLS=10,ROWS=8,WW=COLS*G,WH=ROWS*G;
const RIVER_T=1500,RIVER_B=1700;
const BRIDGES={2:'마포대교',5:'한남대교',8:'성수대교'};
const DX=[1,0,-1,0],DY=[0,1,0,-1],DIRA=[0,Math.PI/2,Math.PI,-Math.PI/2];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};
const lerpAng=(a,b,t)=>a+angDiff(b,a)*t;
const laneOff=d=>[15,-15,-15,15][d];

// ---------- 도로 / 지형 ----------
function isBridgeX(x){for(const c in BRIDGES)if(Math.abs(x-c*G)<RW+6)return true;return false}
function isWater(x,y){return y>RIVER_T&&y<RIVER_B&&!isBridgeX(x)}
function vRoad(c,y){if(c<0||c>COLS)return false;if(BRIDGES[c])return true;return !(y>1200+RW&&y<2000-RW)}
function inWorld(x,y){return x>=-RW&&x<=WW+RW&&y>=-RW&&y<=WH+RW}
function isRoad(x,y){
  if(!inWorld(x,y))return false;
  const c=Math.round(x/G),r=Math.round(y/G);
  if(Math.abs(x-c*G)<RW&&vRoad(c,y))return true;
  if(Math.abs(y-r*G)<RW&&r!==4&&r>=0&&r<=ROWS)return true;
  return false;
}
const NORTH=['홍대','마포','신촌','서대문','종로','명동','이태원','왕십리','성수','청량리'];
const SOUTH=['목동','영등포','노량진','동작','반포','강남','삼성','잠실','잠실','송파'];
function districtAt(x,y){
  const c=clamp(Math.floor(x/G),0,COLS-1),r=Math.floor(y/G);
  if(isWater(x,y))return '한강';
  if(y>1200&&y<2000)return '한강공원';
  if(r===5&&c<=1)return '여의도';
  return y<1200?NORTH[c]:SOUTH[c];
}

// ---------- 도시 생성 ----------
const cells={},allB=[],trees=[];
const SIGNS=['편의점','카페','PC방','치킨','노래방','약국','은행','김밥','분식','국밥','호프','미용실','학원','고깃집','떡볶이','빵집'];
const SPECIAL={
  '4,0':{t:'palace',label:'경복궁'},
  '5,2':{t:'tower',label:'N서울타워'},
  '1,5':{t:'big',label:'63빌딩',col:'#d9a62e',ht:170,w:150,h:210},
  '6,5':{t:'big',label:'코엑스',col:'#8fa9b8',ht:50,w:260,h:190},
  '7,5':{t:'big',label:'롯데월드타워',col:'#d6dee6',ht:280,w:90,h:90},
  '7,2':{t:'park',label:'서울숲'},
  '8,6':{t:'park',label:'올림픽공원'},
  '3,1':{t:'mark',label:'경찰서',col:'#2b4c8c'},
  '6,0':{t:'mark',label:'병원',col:'#f2f2f2'},
  '5,6':{t:'mark',label:'강남역',col:'#3d6b4f'},
  '0,1':{t:'mark',label:'홍대 클럽',col:'#a02d7a'},
};
function shade(h,s,l){return {col:`hsl(${h},${s}%,${l}%)`,wall:`hsl(${h},${s}%,${Math.max(8,l-22)}%)`}}
function addB(cell,b){
  if(!b.col){const h=rnd(0,360)|0,s=rnd(4,22)|0,l=rnd(48,72)|0;Object.assign(b,shade(h,s,l))}
  if(!b.wall)b.wall='rgba(0,0,0,.45)';
  if(!b.ht)b.ht=rnd(20,110);
  cell.b.push(b);allB.push(b);
}
function addTrees(c,r,n){for(let i=0;i<n;i++)trees.push({x:c*G+rnd(40,G-40),y:r*G+rnd(40,G-40),r:rnd(9,16)})}
function buildCity(){
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    const k=c+','+r,cell={b:[],ground:null};cells[k]=cell;
    if(r===3||r===4){cell.ground='#5b9447';
      for(let i=0;i<10;i++){const y=r===3?rnd(1240,1480):rnd(1720,1960);trees.push({x:c*G+rnd(40,G-40),y,r:rnd(8,13)})}
      continue}
    const x0=c*G+RW+22,y0=r*G+RW+22,x1=(c+1)*G-RW-22,y1=(r+1)*G-RW-22,cx=c*G+G/2,cy=r*G+G/2;
    const sp=SPECIAL[k];
    if(sp&&sp.t==='palace'){cell.ground='#cdb68a';
      addB(cell,{x:cx-75,y:cy-45,w:150,h:90,col:'#3f5243',wall:'#7a2a24',ht:35,label:sp.label});
      addB(cell,{x:cx-30,y:y0,w:60,h:30,col:'#3f5243',wall:'#7a2a24',ht:25});
      continue}
    if(sp&&sp.t==='tower'){cell.ground='#467a39';addTrees(c,r,28);
      addB(cell,{x:cx-16,y:cy-16,w:32,h:32,col:'#eeeeee',wall:'#9aa0a6',ht:230,round:true,label:sp.label});continue}
    if(sp&&sp.t==='park'){cell.ground='#4f8a3c';addTrees(c,r,30);cell.label=sp.label;continue}
    if(sp&&sp.t==='big'){addB(cell,{x:cx-sp.w/2,y:cy-sp.h/2,w:sp.w,h:sp.h,col:sp.col,wall:'rgba(40,40,50,.7)',ht:sp.ht,label:sp.label});continue}
    const nx=Math.random()<.5?2:3,ny=Math.random()<.5?2:3,gap=16;
    const bw=(x1-x0-gap*(nx-1))/nx,bh=(y1-y0-gap*(ny-1))/ny;
    let first=true;
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){
      if(!first&&Math.random()<.1)continue;
      const ins=rnd(0,7),b={x:x0+i*(bw+gap)+ins,y:y0+j*(bh+gap)+ins,w:bw-2*ins,h:bh-2*ins,sign:Math.random()<.4?pick(SIGNS):null};
      if(first&&sp){b.label=sp.label;b.col=sp.col;b.sign=null;b.ht=60}
      first=false;addB(cell,b);
    }
  }
  allB.sort((a,b)=>a.ht-b.ht);
}
buildCity();
function solid(x,y){
  if(!inWorld(x,y))return true;
  if(isWater(x,y))return true;
  const cell=cells[Math.floor(x/G)+','+Math.floor(y/G)];if(!cell)return false;
  for(const b of cell.b)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)return true;
  return false;
}

// ---------- 오디오 ----------
let audio=null;
function beep(f,d,type='square',vol=.05){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}

// ---------- 엔티티 ----------
const TYPES={
  sedan:{w:34,h:17,max:9.5,acc:.2,cruise:[3.5,4.5]},
  suv:{w:38,h:19,max:9,acc:.19,cruise:[3.2,4.2]},
  sports:{w:33,h:16,max:13,acc:.32,cruise:[4,5]},
  taxi:{w:34,h:17,max:9.5,acc:.21,cruise:[3.8,4.8],col:'#e8792f'},
  bus:{w:66,h:22,max:6.5,acc:.11,cruise:[2.8,3.4]},
  police:{w:36,h:17,max:12,acc:.3,cruise:[4,5],col:'#f4f6f8'},
};
const CARCOLS=['#f0f0f0','#f0f0f0','#1c1c1c','#1c1c1c','#8a9097','#8a9097','#b22222','#1f4e96','#2d5a3d','#c9b48a','#5b2a86'];
const cars=[],peds=[],skids=[],parts=[],toasts=[];
function makeCar(type,x,y,dir,o={}){
  const T=TYPES[type];
  const c={type,x,y,a:DIRA[dir],dir,v:0,vx:0,vy:0,w:T.w,h:T.h,max:T.max,acc:T.acc,cruise:rnd(...T.cruise),
    col:T.col||(type==='bus'?pick(['#2e8b3e','#1e5fbf','#d64541']):pick(CARCOLS)),
    hp:100,ai:true,driver:true,police:type==='police',wait:0,ignore:0,rev:0,stuck:0};
  Object.assign(c,o);cars.push(c);return c;
}
function trafficType(){const r=Math.random();return r<.45?'sedan':r<.65?'suv':r<.85?'taxi':r<.93?'bus':'sports'}
const SKIN=['#f1c9a0','#e8b98d','#d9a479'],SHIRT=['#e74c3c','#3498db','#f1c40f','#9b59b6','#ecf0f1','#34495e','#e67e22','#1abc9c','#ff7eb6','#222'];
function makePed(x,y){peds.push({x,y,a:rnd(0,7),col:pick(SHIRT),skin:pick(SKIN),down:0,flee:0,step:rnd(0,10)})}

const player={x:5*G+RW+11,y:G+RW+11,a:0,car:null,hp:100,money:5000,walk:0,hurt:0};
const pp=()=>player.car||player;
let wanted=0,heat=0,calm=0,bust=0,shake=0,frame=0,started=false,overlay=null;
const cam={x:player.x,y:player.y,z:1};
function toast(t,c='#fff'){toasts.push({t,c,life:200});if(toasts.length>4)toasts.shift()}

function roadSpot(cx,cy,dmin,dmax){
  for(let k=0;k<25;k++){
    const an=rnd(0,7),dd=rnd(dmin,dmax);let x=cx+Math.cos(an)*dd,y=cy+Math.sin(an)*dd,dir;
    if(Math.random()<.5){const r=Math.round(y/G);if(r===4||r<0||r>ROWS)continue;dir=Math.random()<.5?0:2;y=r*G+laneOff(dir);if(x<0||x>WW)continue}
    else{const c=Math.round(x/G);if(c<0||c>COLS)continue;dir=Math.random()<.5?1:3;x=c*G+laneOff(dir);if(y<0||y>WH||!vRoad(c,y))continue}
    if(!isRoad(x,y)||isWater(x,y))continue;
    if(cars.some(o=>Math.abs(o.x-x)<80&&Math.abs(o.y-y)<80))continue;
    return {x,y,dir};
  }
  return null;
}
function pedSpot(cx,cy,dmin,dmax){
  for(let k=0;k<25;k++){const an=rnd(0,7),dd=rnd(dmin,dmax),x=cx+Math.cos(an)*dd,y=cy+Math.sin(an)*dd;
    if(inWorld(x,y)&&!solid(x,y)&&!isRoad(x,y))return {x,y}}
  return null;
}
function cornerSpot(c,r){return {x:c*G+RW+11,y:r*G+RW+11}}

// 초기 배치
makeCar('sports',5*G+RW+11,G+G/2+20,1,{ai:false,driver:false,col:'#e01b24'});
for(let i=0;i<22;i++){
  const c=Math.floor(rnd(0,COLS)),r=pick([0,1,2,5,6,7]);
  const x=c*G+RW+11,y=r*G+rnd(90,310),t=Math.random()<.5?'sedan':'suv';
  const car=makeCar(t,x,y,1,{ai:false,driver:false});
  if(carHits(car,car.x,car.y,car.a))cars.pop();
}
for(let i=0;i<40;i++){const s=roadSpot(player.x,player.y,150,1400);if(s)makeCar(trafficType(),s.x,s.y,s.dir)}
for(let i=0;i<80;i++){const s=pedSpot(player.x,player.y,60,1100);if(s)makePed(s.x,s.y)}

// ---------- 미션 ----------
const JOBS=[{n:'치킨 배달',i:'🍗'},{n:'떡볶이 배달',i:'🌶️'},{n:'택배 배송',i:'📦'},{n:'손님 태우기',i:'🧍'},{n:'꽃 배달',i:'💐'}];
function randSpot(){return cornerSpot(Math.floor(rnd(0,COLS)),pick([0,1,2,5,6,7]))}
let mission;
function newMission(){let p;do{p=randSpot()}while(Math.hypot(p.x-pp().x,p.y-pp().y)<300);mission={st:'idle',pos:p,job:pick(JOBS)}}
newMission();

// ---------- 입력 ----------
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!started){start();return}
  if(e.code==='KeyF'||e.code==='Enter')toggleCar();
  if(e.code==='KeyH')horn();
  if(e.code==='KeyC')camMode=1-camMode;
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('pointerdown',()=>{if(!started)start()});
const K=(...a)=>a.some(k=>keys[k]);
function start(){started=true;try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}setTimeout(()=>{const h=document.getElementById('help');if(h)h.style.display='none'},20000);toast(isTouch?'환영합니다! 빨간 차에 다가가 🚗탑승 버튼':'서울에 오신 걸 환영합니다! 빨간 스포츠카에 다가가 F키','#ffd34d')}

function horn(){
  if(!player.car)return;beep(330,.35,'sawtooth',.035);beep(415,.35,'sawtooth',.035);
  for(const p of peds)if(dist(p,player.car)<160){p.flee=120;p.a=Math.atan2(p.y-player.car.y,p.x-player.car.x)}
}
function crime(n){heat=Math.min(5,heat+n);const w=Math.ceil(heat);calm=0;if(w>wanted){wanted=w;toast('수배 '+'★'.repeat(w),'#ffd34d');beep(880,.2,'square',.03)}}

function toggleCar(){
  if(overlay)return;
  if(player.car){
    const c=player.car;
    for(const s of [-1,1]){const ex=c.x+Math.cos(c.a+s*Math.PI/2)*(c.h/2+12),ey=c.y+Math.sin(c.a+s*Math.PI/2)*(c.h/2+12);
      if(!solid(ex,ey)){player.x=ex;player.y=ey;player.car=null;c.driver=false;c.ai=false;return}}
    toast('여기서는 내릴 수 없어요');
  }else{
    let best=null,bd=50;
    for(const c of cars){const d=dist(c,player);if(d<bd){bd=d;best=c}}
    if(!best)return;
    if(best.driver){
      const s={x:best.x+Math.cos(best.a+Math.PI/2)*20,y:best.y+Math.sin(best.a+Math.PI/2)*20};
      makePed(s.x,s.y);const p=peds[peds.length-1];p.flee=240;p.a=Math.atan2(p.y-player.y,p.x-player.x);
      crime(best.police?2:1);toast(best.police?'경찰차를 탈취했다!':'차량 탈취!','#ff6b6b');
    }
    best.driver=false;best.ai=false;best.vx=Math.cos(best.a)*best.v;best.vy=Math.sin(best.a)*best.v;
    player.car=best;beep(220,.08,'triangle',.05);
  }
}

// ---------- 물리 ----------
function carHits(car,x,y,a){
  const cs=Math.cos(a),sn=Math.sin(a),hw=car.w/2-2,hh=car.h/2-2;
  for(const [u,v] of [[hw,hh],[hw,-hh],[-hw,hh],[-hw,-hh],[hw,0],[-hw,0],[0,hh],[0,-hh]])
    if(solid(x+u*cs-v*sn,y+u*sn+v*cs))return true;
  return false;
}
function moveCar(car,dx,dy){
  let hit=false;
  if(!carHits(car,car.x+dx,car.y,car.a))car.x+=dx;else hit=true;
  if(!carHits(car,car.x,car.y+dy,car.a))car.y+=dy;else hit=true;
  if(hit){
    const sp=Math.abs(car.v);
    if(sp>4){car.hp-=sp*2.5;if(car===player.car){shake=sp*1.2;beep(90,.15,'square',.06)}}
    car.v*=-.3;car.vx*=-.3;car.vy*=-.3;
  }
  return hit;
}
function drivePlayer(c){
  const I=inputVec(),up=I.y<-.25,dn=I.y>.25,hb=HB(),thr=up?Math.min(1,-I.y*1.4):0;
  const alive=c.hp>0;
  if(alive&&up)c.v+=c.v<0?.35:c.acc*thr;
  if(alive&&dn)c.v-=c.v>0?.3:.12;
  if(!up&&!dn)c.v*=.985;
  if(hb)c.v*=.965;
  if(!alive)c.v*=.94;
  c.v=clamp(c.v,-3.5,c.max);
  const st=clamp(I.x,-1,1)*.05*clamp(c.v/3,-1,1)*(hb?1.6:1);
  const na=c.a+st;if(!carHits(c,c.x,c.y,na))c.a=na;
  const tx=Math.cos(c.a)*c.v,ty=Math.sin(c.a)*c.v,grip=hb?.05:.25;
  c.vx+=(tx-c.vx)*grip;c.vy+=(ty-c.vy)*grip;
  const slip=Math.hypot(tx-c.vx,ty-c.vy);
  if(slip>1.3&&Math.abs(c.v)>3){
    const cs=Math.cos(c.a),sn=Math.sin(c.a);
    for(const s of [-1,1])skids.push({x:c.x-cs*c.w*.35-sn*s*c.h*.4,y:c.y-sn*c.w*.35+cs*s*c.h*.4,life:600});
    if(frame%6===0)beep(rnd(500,700),.05,'sawtooth',.01);
  }
  moveCar(c,c.vx,c.vy);
}
function walkPlayer(){
  const I=inputVec(),m=Math.min(1,Math.hypot(I.x,I.y));player.moving=false;
  if(m>.15){const sp=(RUN()?3.6:2.2)*m,fx=Math.cos(camYaw),fy=Math.sin(camYaw);
    let mx=fx*(-I.y)-fy*I.x,my=fy*(-I.y)+fx*I.x;const l=Math.hypot(mx,my);mx/=l;my/=l;player.a=Math.atan2(my,mx);player.moving=true;
    const nx=player.x+mx*sp,ny=player.y+my*sp;
    if(!solid(nx,player.y))player.x=nx;if(!solid(player.x,ny))player.y=ny;player.walk+=sp*.25}
}
function aiDrive(c){
  const d=c.dir,horiz=d%2===0,look=c.w/2+22,ax=c.x+DX[d]*look,ay=c.y+DY[d]*look;
  let target=c.cruise;
  if(c.wait>200){c.ignore=60;c.wait=0}
  if(c.ignore>0)c.ignore--;
  else{
    for(const o of cars){if(o!==c&&Math.abs(o.x-ax)<o.w*.5+8&&Math.abs(o.y-ay)<o.w*.5+8){target=0;break}}
    if(!player.car&&Math.hypot(player.x-ax,player.y-ay)<22)target=0;
    if(target>0)for(const p of peds)if(p.down<=0&&Math.abs(p.x-ax)<14&&Math.abs(p.y-ay)<14){target=0;break}
  }
  if(target===0&&c.v<.3)c.wait++;else c.wait=0;
  c.v+=(target-c.v)*.08;
  const ix=Math.round(c.x/G)*G,iy=Math.round(c.y/G)*G,before=horiz?c.x:c.y;
  c.x+=DX[d]*c.v;c.y+=DY[d]*c.v;
  const after=horiz?c.x:c.y;
  if(horiz){const r=Math.round((c.y-laneOff(d))/G);c.y+=(r*G+laneOff(d)-c.y)*.1}
  else{const k=Math.round((c.x-laneOff(d))/G);c.x+=(k*G+laneOff(d)-c.x)*.1}
  if(c.v>.1){
    const straightOK=isRoad(ix+DX[d]*(RW+40),iy+DY[d]*(RW+40));
    let turned=false;
    for(const t of [(d+1)%4,(d+3)%4]){
      const line=horiz?ix+laneOff(t):iy+laneOff(t);
      if((before-line)*(after-line)<=0&&before!==after){
        const ok=isRoad(ix+DX[t]*(RW+40),iy+DY[t]*(RW+40));
        if(ok&&(!straightOK||Math.random()<.3)){if(horiz)c.x=line;else c.y=line;c.dir=t;turned=true;break}
      }
    }
    if(!turned&&!isRoad(c.x+DX[c.dir]*(c.w/2+4),c.y+DY[c.dir]*(c.w/2+4))){
      const nd=(c.dir+2)%4;
      if(c.dir%2===0)c.y=Math.round(c.y/G)*G+laneOff(nd);else c.x=Math.round(c.x/G)*G+laneOff(nd);
      c.dir=nd;
    }
  }
  c.a=lerpAng(c.a,DIRA[c.dir],.25);
}
function policeAI(c){
  if(c.hp<=0||wanted===0){c.v*=.95;moveCar(c,Math.cos(c.a)*c.v,Math.sin(c.a)*c.v);return}
  const P=pp(),dx=P.x-c.x,dy=P.y-c.y,d=Math.hypot(dx,dy);
  const diff=angDiff(Math.atan2(dy,dx),c.a);
  let na=c.a;
  if(c.rev>0){c.rev--;c.v=Math.max(c.v-.25,-3);na-=clamp(diff,-.05,.05)}
  else{
    const target=d<70?(player.car?Math.min(8,Math.abs(player.car.v)+1):.3):(Math.abs(diff)>1.3?4:8.5);
    c.v+=clamp(target-c.v,-.35,.25);na+=clamp(diff,-.07,.07)*clamp(c.v/3,-1,1);
  }
  if(!carHits(c,c.x,c.y,na))c.a=na;
  const hit=moveCar(c,Math.cos(c.a)*c.v,Math.sin(c.a)*c.v);
  if(hit){if(++c.stuck>6){c.rev=35;c.stuck=0}}else c.stuck=Math.max(0,c.stuck-1);
}
function coast(c){c.v*=.95;c.vx*=.95;c.vy*=.95;if(Math.abs(c.vx)+Math.abs(c.vy)>.05)moveCar(c,c.vx,c.vy)}
function tryShift(c,dx,dy){if(!carHits(c,c.x+dx,c.y+dy,c.a)){c.x+=dx;c.y+=dy}}
function carCollisions(){
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
    const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.w*.42+b.w*.42;
    if(d>=m||d===0)continue;
    const nx=dx/d,ny=dy/d,push=(m-d)/2;
    tryShift(a,-nx*push,-ny*push);tryShift(b,nx*push,ny*push);
    const va=[Math.cos(a.a)*a.v,Math.sin(a.a)*a.v],vb=[Math.cos(b.a)*b.v,Math.sin(b.a)*b.v];
    const rel=Math.hypot(va[0]-vb[0],va[1]-vb[1]);
    if(rel>3&&!(a.cd>frame)&&!(b.cd>frame)){
      a.cd=b.cd=frame+25;a.hp-=rel*1.5;b.hp-=rel*1.5;
      const pc=player.car;
      if(a===pc||b===pc){shake=rel;beep(80,.18,'square',.07);const o=a===pc?b:a;if(o.police&&o.driver&&rel>4&&!(window._rc>frame)){window._rc=frame+120;crime(1)}}
    }
    a.v*=.6;b.v*=.6;a.vx*=.6;a.vy*=.6;b.vx*=.6;b.vy*=.6;
  }
}
function hits(){
  if(player.hurt>0)player.hurt--;
  for(const c of cars){
    const sp=Math.abs(c.v);if(sp<2.5)continue;
    for(const p of peds){
      if(p.down>0)continue;
      if(Math.hypot(p.x-c.x,p.y-c.y)<c.w*.45+6){
        p.down=300;const kx=p.x+Math.cos(c.a)*20,ky=p.y+Math.sin(c.a)*20;if(!solid(kx,ky)){p.x=kx;p.y=ky}
        if(c===player.car){crime(.5);beep(160,.1,'square',.05);
          for(const q of peds)if(dist(q,p)<200){q.flee=200;q.a=Math.atan2(q.y-p.y,q.x-p.x)}}
      }
    }
    if(!player.car&&player.hurt<=0&&Math.hypot(player.x-c.x,player.y-c.y)<c.w*.45+8){
      player.hp-=sp*5;player.hurt=40;shake=10;beep(120,.2,'square',.07);
      const kx=player.x+Math.cos(c.a)*25,ky=player.y+Math.sin(c.a)*25;if(!solid(kx,ky)){player.x=kx;player.y=ky}
    }
  }
}
function updatePeds(){
  for(const p of peds){
    if(p.down>0){p.down--;continue}
    if(wanted>=2&&!p.flee&&dist(p,pp())<150){p.flee=120;p.a=Math.atan2(p.y-pp().y,p.x-pp().x)}
    const sp=p.flee>0?2.3:.6;if(p.flee>0)p.flee--;
    if(Math.random()<.01)p.a+=rnd(-1.5,1.5);
    const nx=p.x+Math.cos(p.a)*sp,ny=p.y+Math.sin(p.a)*sp;
    if(solid(nx,ny)||(p.flee<=0&&!isRoad(p.x,p.y)&&isRoad(nx,ny)&&Math.random()<.995))p.a+=Math.PI*rnd(.5,1.5);
    else{p.x=nx;p.y=ny;p.step+=sp*.3}
  }
}
function populate(){
  const P=pp();
  for(let i=cars.length-1;i>=0;i--){const c=cars[i];if(c===player.car)continue;const d=dist(c,P);
    if((c.ai&&c.driver&&!c.police&&d>1800)||(c.police&&(wanted===0||c.hp<=0)&&d>900)||(!c.driver&&d>2600&&!c.police&&cars.length>60))cars.splice(i,1)}
  for(let i=peds.length-1;i>=0;i--)if(dist(peds[i],P)>1500)peds.splice(i,1);
  const traffic=cars.filter(c=>c.ai&&c.driver&&!c.police).length;
  if(traffic<38){const s=roadSpot(P.x,P.y,700,1300);if(s)makeCar(trafficType(),s.x,s.y,s.dir)}
  if(peds.length<80){const s=pedSpot(P.x,P.y,600,1100);if(s)makePed(s.x,s.y)}
  if(wanted>0){const cops=cars.filter(c=>c.police&&c.driver&&c.hp>0).length;
    if(cops<Math.min(7,wanted*2)){const s=roadSpot(P.x,P.y,650,950);if(s){const c=makeCar('police',s.x,s.y,s.dir,{ai:false});c.a=Math.atan2(P.y-c.y,P.x-c.x)}}}
}
function respawnAt(c,r){const s=cornerSpot(c,r);if(player.car){player.car.driver=false;player.car=null}player.x=s.x;player.y=s.y;
  for(let i=cars.length-1;i>=0;i--)if(cars[i].police&&cars[i].driver)cars.splice(i,1);
  wanted=0;heat=0;bust=0;camSnap=true}
function wantedLogic(){
  const P=pp();
  if(wanted>0){
    let near=false,seen=false;
    for(const c of cars){if(!c.police||!c.driver||c.hp<=0)continue;const d=dist(c,P);if(d<650)seen=true;
      if(d<55&&(!player.car||Math.abs(player.car.v)<1.2))near=true}
    calm=seen?0:calm+1;
    if(calm>420){wanted--;heat=wanted;calm=0;toast(wanted?'수배 레벨 감소':'수배 해제! 따돌렸다','#7CFC7C')}
    bust=near?bust+1:Math.max(0,bust-2);
    if(bust>150){const fine=Math.max(500,Math.round(player.money*.1/100)*100);player.money=Math.max(0,player.money-fine);
      overlay={t:'체포됨',s:'벌금 ₩'+fine.toLocaleString(),c:'#4da3ff',life:180};respawnAt(3,1);beep(200,.6,'sawtooth',.04)}
  }else{bust=0;calm=0}
  if(player.hp<=0){player.money=Math.max(0,player.money-1000);player.hp=100;
    overlay={t:'의식을 잃었다',s:'병원비 ₩1,000',c:'#ff5e5e',life:180};respawnAt(6,0);if(mission.st==='go')newMission()}
}
function missionLogic(){
  const P=pp();
  if(mission.st==='idle'&&dist(P,mission.pos)<40){
    let dst;do{dst=randSpot()}while(Math.hypot(dst.x-P.x,dst.y-P.y)<1000);
    const d=Math.hypot(dst.x-P.x,dst.y-P.y);
    Object.assign(mission,{st:'go',dest:dst,time:Math.round(d/2.6+600),max:0,reward:Math.round(d/100)*1000+3000});
    mission.max=mission.time;toast(mission.job.n+' 시작! → '+districtAt(dst.x,dst.y),'#ffd34d');beep(660,.15,'triangle',.05);
  }else if(mission.st==='go'){
    mission.time--;
    if(dist(P,mission.dest)<40){const bonus=Math.round(mission.time/mission.max*mission.reward*.5/100)*100,tot=mission.reward+bonus;
      player.money+=tot;toast('완료! +₩'+tot.toLocaleString()+(bonus?' (빠른 배달 보너스)':''),'#7CFC7C');beep(880,.12,'triangle',.05);setTimeout(()=>beep(1175,.2,'triangle',.05),120);newMission()}
    else if(mission.time<=0){toast('시간 초과… 실패','#ff6b6b');newMission()}
  }
}
function update(){
  frame++;
  if(!started)return;
  if(overlay){overlay.life--;if(overlay.life<=0)overlay=null;return}
  if(player.car)drivePlayer(player.car);else walkPlayer();
  for(const c of cars){if(c===player.car)continue;
    if(c.police&&c.driver)policeAI(c);else if(c.ai&&c.driver&&c.hp>0)aiDrive(c);else coast(c);
    if(c.hp<35&&frame%4===0)parts.push({x:c.x,y:c.y,vx:rnd(-.3,.3),vy:rnd(-.6,-.2),life:60,r:rnd(4,8),dark:c.hp<=0})}
  if(player.car&&player.car.hp<35&&frame%4===0)parts.push({x:player.car.x,y:player.car.y,vx:rnd(-.3,.3),vy:rnd(-.6,-.2),life:60,r:rnd(4,8),dark:player.car.hp<=0});
  carCollisions();hits();updatePeds();wantedLogic();missionLogic();
  if(frame%15===0)populate();
  for(let i=skids.length-1;i>=0;i--)if(--skids[i].life<=0)skids.splice(i,1);if(skids.length>700)skids.splice(0,skids.length-700);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.r+=.15;if(--p.life<=0)parts.splice(i,1)}
  for(let i=toasts.length-1;i>=0;i--)if(--toasts[i].life<=0)toasts.splice(i,1);
  shake*=.85;
}

const VS=`attribute vec3 p;attribute vec3 n;attribute vec3 c;attribute float w;
uniform mat4 vp;varying vec3 vc;varying vec3 vn;varying vec3 vw3;varying float vf;

const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec3 cam;uniform vec3 fogC;uniform float fogN;uniform float fogF;uniform float alpha;
varying vec3 vc;varying vec3 vn;varying vec3 vw3;varying float vf;
void main(){

const GVS=`attribute vec3 p;attribute vec2 uv;uniform mat4 vp;varying vec2 vuv;varying vec3 vw3;
void main(){vuv=uv;vw3=p;gl_Position=vp*vec4(p,1.);}`;
const GFS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

function prog(vs,fs){const p=gl.createProgram();for(const [t,s] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh)}gl.linkProgram(p);return p}

class Geo{constructor(cap){this.f=new Float32Array(cap);this.n=0}
  grow(k){if(this.n+k>this.f.length){const g=new Float32Array(Math.max(this.f.length*2,this.n+k));g.set(this.f);this.f=g}}
  v(x,y,z,nx,ny,nz,c,w){this.grow(10);const f=this.f,i=this.n;f[i]=x;f[i+1]=y;f[i+2]=z;f[i+3]=nx;f[i+4]=ny;f[i+5]=nz;f[i+6]=c[0];f[i+7]=c[1];f[i+8]=c[2];f[i+9]=w;this.n+=10}
  quad(a,b,c2,d,ctr,col,w){
    let ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c2[0]-a[0],vy=c2[1]-a[1],vz=c2[2]-a[2];
    if(Math.abs(ux)+Math.abs(uy)+Math.abs(uz)<1e-6){ux=c2[0]-b[0];uy=c2[1]-b[1];uz=c2[2]-b[2];vx=d[0]-b[0];vy=d[1]-b[1];vz=d[2]-b[2]}
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
    const mx=(a[0]+c2[0])/2-ctr[0],my=(a[1]+c2[1])/2-ctr[1],mz=(a[2]+c2[2])/2-ctr[2];
    if(nx*mx+ny*my+nz*mz<0){nx=-nx;ny=-ny;nz=-nz}
    for(const q of [a,b,c2,a,c2,d])this.v(q[0],q[1],q[2],nx,ny,nz,col,w);
  }
  // 각기둥/절두체: 바닥 반폭(bu,bv), 윗면 반폭(tu,tv), 높이 h, XZ 평면 회전 a
  prism(cx,y0,cz,bu,bv,tu,tv,h,a,col,w=0,bottom=false){
    const cs=Math.cos(a),sn=Math.sin(a),T=(u,v,y)=>[cx+u*cs-v*sn,y,cz+u*sn+v*cs];
    const B=[T(-bu,-bv,y0),T(bu,-bv,y0),T(bu,bv,y0),T(-bu,bv,y0)],U=[T(-tu,-tv,y0+h),T(tu,-tv,y0+h),T(tu,tv,y0+h),T(-tu,tv,y0+h)];

  }
  box(cx,y0,cz,hu,hv,h,a,col,w=0){this.prism(cx,y0,cz,hu,hv,hu,hv,h,a,col,w)}
  cyl(cx,y0,cz,r0,r1,h,seg,col,w=0){
    const ctr=[cx,y0+h/2,cz];
    for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;
      const p=(r,a,y)=>[cx+Math.cos(a)*r,y,cz+Math.sin(a)*r];
      this.quad(p(r0,a0,y0),p(r0,a1,y0),p(r1,a1,y0+h),p(r1,a0,y0+h),ctr,col,w);
      if(r1>0)this.quad([cx,y0+h,cz],[cx,y0+h,cz],p(r1,a0,y0+h),p(r1,a1,y0+h),[cx,y0,cz],col,w);
    }

}

function txt(t,x,y,col='#fff',font='bold 14px sans-serif',align='center',lw=4){ctx.font=font;ctx.textAlign=align;ctx.lineJoin='round';if(lw){ctx.lineWidth=lw;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(t,x,y)}ctx.fillStyle=col;ctx.fillText(t,x,y)}
const MM=.045,mm=document.createElement('canvas');mm.width=WW*MM;mm.height=WH*MM;
(function(){const m=mm.getContext('2d');m.fillStyle='#8f8a80';m.fillRect(0,0,mm.width,mm.height);
  for(const k in cells){const [c,r]=k.split(',').map(Number);if(cells[k].ground){m.fillStyle=cells[k].ground;m.fillRect(c*G*MM,r*G*MM,G*MM,G*MM)}}
  m.fillStyle='#3c78b0';m.fillRect(0,RIVER_T*MM,mm.width,(RIVER_B-RIVER_T)*MM);
  m.fillStyle='#2e2e33';
  for(let r=0;r<=ROWS;r++)if(r!==4)m.fillRect(0,(r*G-RW)*MM,mm.width,2*RW*MM);
  for(let c=0;c<=COLS;c++){if(BRIDGES[c])m.fillRect((c*G-RW)*MM,0,2*RW*MM,mm.height);else{m.fillRect((c*G-RW)*MM,0,2*RW*MM,(1200+RW)*MM);m.fillRect((c*G-RW)*MM,(2000-RW)*MM,2*RW*MM,(WH-2000+RW)*MM)}}
  m.fillStyle='rgba(60,60,70,.55)';for(const b of allB)m.fillRect(b.x*MM,b.y*MM,b.w*MM,b.h*MM);
})();
function drawHUD(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,VW,VH);
  const P=pp(),mob=isTouch||VW<760,S=mob?.82:1,F=n=>`bold ${Math.round(n*S)}px sans-serif`;
  // 3D 라벨
  for(const l of labels){const d=Math.hypot(l.x-P.x,l.z-P.y);if(d>(l.big?2200:900))continue;const p=project(l.x,l.y,l.z);if(p.w<=0)continue;
    if(p.x<-100||p.x>VW+100||p.y<-50||p.y>VH+50)continue;ctx.globalAlpha=clamp(1.4-d/(l.big?2200:900),0,1);txt(l.t,p.x,p.y,'#fff',F(l.big?17:14),'center',4);ctx.globalAlpha=1}
  // 미션 마커 아이콘
  const T=mission.st==='idle'?mission.pos:mission.dest,icon=mission.st==='idle'?mission.job.i:'🏁';
  const tp=project(T.x,40+Math.sin(frame*.08)*5,T.y),td=Math.hypot(T.x-P.x,T.y-P.y);
  const onScr=tp.w>0&&tp.x>30&&tp.x<VW-30&&tp.y>60&&tp.y<VH-30;
  if(onScr){ctx.font=`${Math.round(clamp(2400/Math.max(tp.w,1),18,44))}px sans-serif`;ctx.textAlign='center';ctx.fillText(icon,tp.x,tp.y);txt((td*2.5/1000).toFixed(1)+'km',tp.x,tp.y+18,'#fff',F(12),'center',3)}
  // 상단 정보
  const top=mob?24:34;
  txt('₩'+player.money.toLocaleString(),VW-14,top+4,'#7CFC7C',F(28),'right',5);
  for(let i=0;i<5;i++){const on=i<wanted,fl=on&&calm>0&&frame%30<15;txt('★',VW-18-(4-i)*25*S,top+32*S,on?(fl?'#fff':'#ffd34d'):'rgba(255,255,255,.3)',F(24),'right',3)}
  txt('📍 '+districtAt(P.x,P.y),14,top,'#fff',F(20),'left',5);
  if(player.car){txt(Math.round(Math.abs(player.car.v)*18)+' km/h',14,top+26*S,'#fff',F(18),'left');
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(14,top+34*S,110,8);ctx.fillStyle=player.car.hp>50?'#4cd964':player.car.hp>0?'#ffb020':'#ff3b30';ctx.fillRect(14,top+34*S,110*clamp(player.car.hp,0,100)/100,8)}
  else{ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(14,top+12*S,110,8);ctx.fillStyle='#ff5e5e';ctx.fillRect(14,top+12*S,110*clamp(player.hp,0,100)/100,8)}
  // 미션 배너
  let mt;if(mission.st==='idle')mt=mission.job.i+' '+districtAt(mission.pos.x,mission.pos.y)+'에서 '+mission.job.n+' 받기';
  else{const s=Math.ceil(mission.time/60);mt=mission.job.i+' '+mission.job.n+' → '+districtAt(mission.dest.x,mission.dest.y)+' ⏱'+s+'초 ₩'+mission.reward.toLocaleString()}
  ctx.font=F(15);const mw=Math.min(VW-20,ctx.measureText(mt).width+26),my=mob?6:12;
  ctx.fillStyle='rgba(0,0,0,.55)';rr(VW/2-mw/2,my,mw,30*S+2,15);ctx.fill();
  txt(mt,VW/2,my+21*S,mission.st==='go'&&mission.time<600&&frame%30<15?'#ff6b6b':'#fff',F(15),'center',0);
  // 화면 밖 목표 화살표
  if(!onScr){let dx=tp.x-VW/2,dy=tp.y-VH/2;if(tp.w<=0){dx=-dx;dy=-dy}
    if(tp.w<=0&&Math.abs(dy)<1)dy=1;
    const an=Math.atan2(dy,dx),m=Math.min((VW/2-44)/Math.abs(Math.cos(an)||1e-3),(VH/2-70)/Math.abs(Math.sin(an)||1e-3));
    const ex=VW/2+Math.cos(an)*m,ey=VH/2+Math.sin(an)*m;
    ctx.save();ctx.translate(ex,ey);ctx.rotate(an);ctx.fillStyle=mission.st==='idle'?'#ffd34d':'#4dff88';ctx.strokeStyle='#000';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-10,-12);ctx.lineTo(-4,0);ctx.lineTo(-10,12);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    txt((td*2.5/1000).toFixed(1)+'km',ex,ey+28,'#fff',F(12))}
  // 체포 게이지
  if(bust>0){const by=mob?VH*.62:VH-90;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(VW/2-100,by,200,14);ctx.fillStyle='#4da3ff';ctx.fillRect(VW/2-100,by,200*bust/150,14);txt('체포 중... 도망쳐!',VW/2,by-8,'#fff',F(15))}
  toasts.forEach((t,i)=>{ctx.globalAlpha=Math.min(1,t.life/30);txt(t.t,VW/2,(mob?VH*.3:90)+i*26,t.c,F(18));ctx.globalAlpha=1});
  // 미니맵 (플레이어 시점 방향으로 회전하지 않는 전체 지도)
  const ms=mob?.55:1,mw2=mm.width*ms,mh2=mm.height*ms,mx=VW-mw2-12,mY=mob?top+42*S:VH-mh2-12;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(mx-3,mY-3,mw2+6,mh2+6);ctx.drawImage(mm,mx,mY,mw2,mh2);
  const q=MM*ms;
  for(const c of cars)if(c.police&&c.driver&&c.hp>0){ctx.fillStyle=frame%20<10?'#f33':'#36f';ctx.fillRect(mx+c.x*q-2,mY+c.y*q-2,4,4)}
  if(frame%30<20){ctx.fillStyle=mission.st==='idle'?'#ffd34d':'#4dff88';ctx.beginPath();ctx.arc(mx+T.x*q,mY+T.y*q,4,0,7);ctx.fill()}
  ctx.save();ctx.translate(mx+P.x*q,mY+P.y*q);ctx.rotate(player.car?player.car.a:player.a);ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-4);ctx.lineTo(-4,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  // 근처 차 탑승 안내 (모바일)
  if(!player.car&&started&&!overlay){let near=false;for(const c of cars)if(dist(c,player)<50){near=true;break}
    if(near)txt(isTouch?'🚗 탑승 버튼을 누르세요':'F 키로 탑승',VW/2,VH*.72,'#ffd34d',F(17))}
  if(overlay){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,VW,VH);txt(overlay.t,VW/2,VH/2,overlay.c,F(56),'center',8);txt(overlay.s,VW/2,VH/2+44,'#fff',F(22))}
  if(!started){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,VW,VH);
    txt('서울 스트리트 3D',VW/2,VH/2-40,'#ffd34d',`bold ${Math.min(60,VW/9)|0}px sans-serif`,'center',8);
    txt('오픈월드 서울 · 배달 미션 · 경찰 추격',VW/2,VH/2+5,'#fff',F(19));
    txt(isTouch?'화면을 터치해서 시작 (가로 화면 추천)':'클릭하거나 아무 키나 눌러 시작',VW/2,VH/2+48,frame%60<40?'#fff':'#999',F(17))}
}

// ---------- 터치 컨트롤 ----------
(function(){
  const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid=null;
  function setK(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const R=r.width/2-10,d=Math.hypot(dx,dy);
    if(d>R){dx*=R/d;dy*=R/d}touch.x=dx/R;touch.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
  joy.addEventListener('pointerdown',e=>{e.preventDefault();if(!started)start();pid=e.pointerId;joy.setPointerCapture(pid);touch.active=true;setK(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===pid)setK(e)});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;touch.active=false;touch.x=touch.y=0;knob.style.transform=''};
  joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
  const btn=(id,down,up)=>{const b=document.getElementById(id);
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!started){start();return}b.classList.add('on');down&&down()});
    const u=e=>{b.classList.remove('on');up&&up()};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('pointerleave',u);
    b.addEventListener('contextmenu',e=>e.preventDefault())};
  btn('bF',()=>toggleCar());btn('bH',()=>horn());btn('bCam',()=>{camMode=1-camMode});
  btn('bHB',()=>touch.hb=true,()=>touch.hb=false);btn('bR',()=>touch.run=true,()=>touch.run=false);
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
})();

let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.67){update();acc-=16.67}render3D();drawHUD();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
