<script>

}

const keys={};const K=(...a)=>a.some(k=>keys[k]);

// ===== 월드 규격: 1m ≈ 8.6 유닛 · 사람 키 ≈ 15 · 한 층 ≈ 27.5 =====
const G=400,RW=30,COLS=24,ROWS=16,WW=COLS*G,WH=ROWS*G,FLOOR=14,PSC=.47,PSC_IN=.85,CS=.5;
const PRN=7,PRS=8,RR=8,PARK_T=PRN*G,PARK_B=(PRS+1)*G,RIVER_T=3100,RIVER_B=3300;
const BRIDGES={3:'가양대교',6:'성산대교',9:'마포대교',12:'한남대교',15:'성수대교',18:'잠실대교',21:'강동대교'};
const AIR={c0:0,c1:5,r0:10,r1:14},AX0=AIR.c0*G,AX1=AIR.c1*G,AY0=AIR.r0*G,AY1=AIR.r1*G;
const RWY={x0:160,x1:1840,z:4800,hw:50},TWY={z:4500,hw:26};
const inAirport=(x,y)=>x>AX0+RW&&x<AX1-RW&&y>AY0+RW&&y<AY1-RW;
const DX=[1,0,-1,0],DY=[0,1,0,-1],DIRA=[0,Math.PI/2,Math.PI,-Math.PI/2];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};
const lerpAng=(a,b,t)=>a+angDiff(b,a)*t;
const laneOff=d=>[15,-15,-15,15][d];
const won=n=>'₩'+Math.round(n).toLocaleString();

// ---------- 도로 / 지형 ----------
function isBridgeX(x){for(const c in BRIDGES)if(Math.abs(x-c*G)<RW+6)return true;return false}
function isWater(x,y){return y>RIVER_T&&y<RIVER_B&&!isBridgeX(x)}
function vRoad(c,y){if(c<0||c>COLS)return false;if(c>AIR.c0&&c<AIR.c1&&y>AY0+RW&&y<AY1-RW)return false;if(BRIDGES[c])return true;return !(y>PARK_T+RW&&y<PARK_B-RW)}
function hRoad(r,x){if(r<0||r>ROWS||r===RR)return false;if(r>AIR.r0&&r<AIR.r1&&x<AX1-RW)return false;return true}
function inWorld(x,y){return x>=-RW&&x<=WW+RW&&y>=-RW&&y<=WH+RW}
function isRoad(x,y){
  if(!inWorld(x,y))return false;
  const c=Math.round(x/G),r=Math.round(y/G);
  if(Math.abs(x-c*G)<RW&&vRoad(c,y))return true;
  if(Math.abs(y-r*G)<RW&&hRoad(r,x))return true;
  return false;
}
const isPark=r=>r===PRN||r===PRS;
const cityCell=(c,r)=>c>=0&&c<COLS&&r>=0&&r<ROWS&&!isPark(r)&&!(c>=AIR.c0&&c<AIR.c1&&r>=AIR.r0&&r<AIR.r1);
const FAR_N=['일산','일산','일산','고양','고양','은평','은평','북한산','북한산','평창동','부암동','성북','성북','미아','미아','노원','노원','도봉','의정부','의정부','남양주','남양주','남양주','남양주'];
const MID_N=['김포','김포','강서','강서','은평','상암','홍대','마포','신촌','서대문','종로','명동','이태원','동대문','왕십리','성수','청량리','광진','광진','구리','구리','하남','하남','하남'];
const MID_S=['부천','부천','강서','강서','목동','목동','영등포','여의도','노량진','동작','반포','강남','강남','삼성','잠실','잠실','송파','송파','하남','하남','성남','분당','분당','판교'];

function regionAt(x,y){const c=clamp(Math.floor(x/G),0,COLS-1),r=clamp(Math.floor(y/G),0,ROWS-1);
  if(x>=AX0&&x<AX1&&y>=AY0&&y<AY1)return '김포공항';if(y>PARK_T&&y<PARK_B)return '한강공원';
  return r<=1?FAR_N[c]:r<PRN?MID_N[c]:r<13?MID_S[c]:FAR_S[c]}
function districtAt(x,y){
  if(player&&player.inside)return player.inside.door.role;
  if(player&&player.plane&&player.plane.alt>5)return regionAt(x,y)+' 상공';
  if(isWater(x,y))return '한강';return regionAt(x,y)}

function intAt(x){const i=Math.floor((x-IX0+20)/400);return i>=0&&i<IKINDS.length?INTS[IKINDS[i]]:null}
function solid(x,y){
  if(x>IX0-150){const R=intAt(x);if(!R)return true;
    if(x<R.x0+4||x>R.x1-4||y<R.z0+4||y>R.z1-2)return true;
    for(const f of R.furn)if(!f.decor&&Math.abs(x-f.X)<f.hw+1&&Math.abs(y-f.Z)<f.hd+1)return true;return false}
  if(!inWorld(x,y))return true;
  if(isWater(x,y))return true;
  const cell=cells[Math.floor(x/G)+','+Math.floor(y/G)];if(!cell)return false;
  for(const b of cell.b)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)return true;
  return false;
}

let audio=null,noiseBuf=null;
function beep(f,d,type='square',vol=.05){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}
function noise(dur,freq,type,vol){if(!audio||!noiseBuf)return;const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();
  s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(audio.destination);
  g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);s.start();s.stop(audio.currentTime+dur)}

function roadSpot(cx,cy,dmin,dmax){
  for(let k=0;k<25;k++){
    const an=rnd(0,7),dd=rnd(dmin,dmax);let x=cx+Math.cos(an)*dd,y=cy+Math.sin(an)*dd,dir;
    if(Math.random()<.5){const r=Math.round(y/G);if(r<0||r>ROWS||!hRoad(r,x))continue;dir=Math.random()<.5?0:2;y=r*G+laneOff(dir);if(x<0||x>WW)continue}
    else{const c=Math.round(x/G);if(c<0||c>COLS)continue;dir=Math.random()<.5?1:3;x=c*G+laneOff(dir);if(y<0||y>WH||!vRoad(c,y))continue}
    if(!isRoad(x,y)||isWater(x,y))continue;
    if(Math.abs(x-Math.round(x/G)*G)<RW+30&&Math.abs(y-Math.round(y/G)*G)<RW+30)continue;
    if(cars.some(o=>Math.abs(o.x-x)<70&&Math.abs(o.y-y)<70))continue;
    return {x,y,dir};
  }
  return null;
}

}

function light(c,r,axis){const o=SIG.get(c*100+r);if(o===undefined)return 'g';const t=(frame+o)%TL;
  if(axis===0)return t<120?'g':t<140?'y':'r';return t<150?'r':t<270?'g':t<290?'y':'r'}
function signalStop(c){
  const d=c.dir,horiz=d%2===0,s=d<2?1:-1,pos=horiz?c.x:c.y,front=pos+s*c.w/2;

function carHits(car,x,y,a){
  const cs=Math.cos(a),sn=Math.sin(a),hw=car.w/2-2,hh=car.h/2-2;
  for(const [u,v] of [[hw,hh],[hw,-hh],[-hw,hh],[-hw,-hh],[hw,0],[-hw,0],[0,hh],[0,-hh]])
    if(solid(x+u*cs-v*sn,y+u*sn+v*cs))return true;
  return false;
}
function moveCar(car,dx,dy){
  let hit=false;
  if(!carHits(car,car.x+dx,car.y,car.a))car.x+=dx;else hit=true;
  if(!carHits(car,car.x,car.y+dy,car.a))car.y+=dy;else hit=true;
  if(hit){
    const sp=Math.abs(car.v);
    if(sp>2.6){car.hp-=sp*3.8;if(car===player.car){shake=sp*1.2;beep(90,.15,'square',.06);onPlayerCrash(sp)}}
    car.v*=-.2;car.vx*=-.2;car.vy*=-.2;
  }
  return hit;
}
// 운전: 부드러운 조향 · 속도별 조향 감소 · 직진 보조 (설정에서 감도/최고속 조절)
function drivePlayer(c){

  const alive=c.hp>0,tu=(c.tune||1)*(1+.04*player.sk.drive),vmax=c.max*tu*settings.speed;
  if(alive&&up)c.v+=c.v<0?.32:c.acc*tu*thr*(1-.55*clamp(c.v/vmax,0,1));
  if(alive&&dn)c.v-=c.v>0?.26:.1;

  if(!alive)c.v*=.94;
  c.v=clamp(c.v,-2,vmax);
  const sIn=clamp(I.x,-1,1)*(Math.abs(I.x)<.12?0:1);
  c.steer=(c.steer||0)+(sIn-(c.steer||0))*(sIn===0?.25:.11*settings.steer);
  const sv=Math.abs(c.v),spF=clamp(c.v/1.5,-1,1)*(1-.5*clamp((sv-2.6)/5.2,0,1));
  const na=c.a+c.steer*.044*settings.steer*spF*(hb?1.55:1);if(!carHits(c,c.x,c.y,na))c.a=na;
  if(settings.assist&&sIn===0&&!hb&&sv>1.6){const q=Math.round(c.a/(Math.PI/2))*(Math.PI/2);if(Math.abs(angDiff(q,c.a))<.22)c.a=lerpAng(c.a,q,.035)}

    const cs=Math.cos(c.a),sn=Math.sin(c.a);
    for(const s of [-1,1])skids.push({x:c.x-cs*c.w*.35-sn*s*c.h*.4,y:c.y-sn*c.w*.35+cs*s*c.h*.4,life:600});
    if(frame%6===0)beep(rnd(500,700),.05,'sawtooth',.01);

}
function walkPlayer(){
  const I=menuOpen?{x:0,y:0}:inputVec(),m=Math.min(1,Math.hypot(I.x,I.y));player.moving=false;player.spd=0;
  if(m>.15){const base=(RUN()?2.1:1.25)*(player.inside?1.7:1)*(1+.06*player.sk.run)*(player.gear&&player.gear.shoes?1.1:1),sp=base*m*(player.buff>0?1.3:1)*(player.hunger<=0?.75:1)*(player.energy<=0?.7:1)*(player.atk>0?.45:1),fx=Math.cos(camYaw),fy=Math.sin(camYaw);
    let mx=fx*(-I.y)-fy*I.x,my=fy*(-I.y)+fx*I.x;const l=Math.hypot(mx,my);mx/=l;my/=l;
    if(player.aimT<=0)player.a=lerpAng(player.a,Math.atan2(my,mx),.35);player.moving=true;player.spd=sp;

function aiDrive(c){
  const d=c.dir,horiz=d%2===0,look=c.w/2+13,ax=c.x+DX[d]*look,ay=c.y+DY[d]*look;
  let target=c.cruise,blocked=false;

  if(c.ignore>0)c.ignore--;

    for(const o of cars){if(o!==c&&Math.abs(o.x-ax)<o.w*.5+8&&Math.abs(o.y-ay)<o.w*.5+8){blocked=true;break}}
    if(!player.car&&!player.inside&&Math.hypot(player.x-ax,player.y-ay)<12)blocked=true;
    if(!blocked)for(const p of peds)if(p.down<=0&&Math.abs(p.x-ax)<8&&Math.abs(p.y-ay)<8){blocked=true;break}
    if(blocked)target=0;
  }

  if(blocked&&c.v<.3){c.wait++;if(c.wait===90&&dist(c,pp())<300)beep(380,.18,'sawtooth',.015)}else c.wait=0;
  c.v+=(target-c.v)*(target<c.v?.12:.06);

  c.x+=DX[d]*c.v;c.y+=DY[d]*c.v;

  else{const k=Math.round((c.x-laneOff(d))/G);c.x+=(k*G+laneOff(d)-c.x)*.1}
  if(c.v>.1){
    const straightOK=isRoad(ix+DX[d]*(RW+40),iy+DY[d]*(RW+40));
    let turned=false;
    for(const t of [(d+1)%4,(d+3)%4]){
      const line=horiz?ix+laneOff(t):iy+laneOff(t);
      if((before-line)*(after-line)<=0&&before!==after){
        const ok=isRoad(ix+DX[t]*(RW+40),iy+DY[t]*(RW+40));
        if(ok&&(!straightOK||Math.random()<(c.flee?.5:.3))){if(horiz)c.x=line;else c.y=line;c.dir=t;turned=true;break}
      }

      const nd=(c.dir+2)%4;

function policeAI(c){

    const target=d<45?(player.car?Math.min(5.5,Math.abs(player.car.v)+.7):.2):(Math.abs(diff)>1.3?2.6:5.6);

function tryShift(c,dx,dy){if(!carHits(c,c.x+dx,c.y+dy,c.a)){c.x+=dx;c.y+=dy}}
function carCollisions(){
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
    const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)>80||Math.abs(dy)>80)continue;

    const va=[Math.cos(a.a)*a.v,Math.sin(a.a)*a.v],vb=[Math.cos(b.a)*b.v,Math.sin(b.a)*b.v];
    const rel=Math.hypot(va[0]-vb[0],va[1]-vb[1]);
    if(rel>2&&!(a.cd>frame)&&!(b.cd>frame)){
      a.cd=b.cd=frame+25;a.hp-=rel*2.3;b.hp-=rel*2.3;
      const pc=player.car;
      if(a===pc||b===pc){shake=rel;beep(80,.18,'square',.07);onPlayerCrash(rel);const o=a===pc?b:a;if(o.police&&o.driver&&rel>4&&!(window._rc>frame)){window._rc=frame+120;crime(1)}}

function resolvePunch(){
  const W=WEAP[player.cur],heavy=player.combo===3,ca=Math.cos(player.a),sa=Math.sin(player.a),reach=W.range*.8,hx=player.x+ca*reach,hy=player.y+sa*reach;
  let hit=false;
  for(const p of peds){
    if(p.down>0||Math.hypot(p.x-hx,p.y-hy)>W.range)continue;
    hit=true;p.hp-=(W.dmg+(heavy?1:0))*player.str*(1+.15*player.sk.str);p.hit=12;p.flee=0;p.atk=0;p.a=player.a+Math.PI;
    const kb=heavy?10:4,kx=p.x+ca*kb,ky=p.y+sa*kb;if(!solid(kx,ky)){p.x=kx;p.y=ky}
    if(p.hp<=0)koPed(p,false);
    else if(!p.angry&&(p.boss||Math.random()<.45)){p.angry=900;pop(p.x,p.y,'덤벼!','#ff9f43')}
    else if(!p.angry){p.flee=200;p.a=player.a}
  }
  if(!hit)for(const c of cars){
    if(c===player.car||Math.hypot(c.x-hx,c.y-hy)>c.w*.5+4)continue;
    hit=true;c.hp-=(heavy?6:3)*(W.dmg);if(c.police&&c.driver)crime(1);else if(c.driver&&c.ai)beep(420,.25,'sawtooth',.02);break;
  }
  if(hit){burst(hx,10,hy,heavy?14:7);shake=heavy?8:3.5;sfxHit(heavy);pop(hx,hy,heavy?'콰광!':pick(['퍽!','빡!','팍!']),heavy?'#ff5e3a':'#ffd34d')}
}
function shoot(){
  const id=player.cur,W=WEAP[id];if(player.cd>0)return;
  if(player.ammo[id]<=0){toast('탄약이 없어요 — 총포사에서 구매하세요','#ff6b6b');player.cd=40;beep(200,.05,'square',.03);return}
  player.ammo[id]--;player.cd=Math.round(W.cd*(1-.08*player.sk.gun));player.aimT=26;
  let best=null,bs=1e9;
  for(const p of peds){if(p.down>0)continue;const dx=p.x-player.x,dy=p.y-player.y,d=Math.hypot(dx,dy);if(d>W.range||d<2)continue;
    const ad=Math.abs(angDiff(Math.atan2(dy,dx),player.a));if(ad>.65+.05*player.sk.gun)continue;const sc=d*(1+ad*2);if(sc<bs){bs=sc;best=p}}
  if(!best)for(const c of cars){if(c.boom)continue;const dx=c.x-player.x,dy=c.y-player.y,d=Math.hypot(dx,dy);if(d>W.range||d<2)continue;
    const ad=Math.abs(angDiff(Math.atan2(dy,dx),player.a));if(ad>.5)continue;const sc=d*(1+ad*2);if(sc<bs){bs=sc;best=c}}
  if(best)player.a=Math.atan2(best.y-player.y,best.x-player.x);
  const n=W.pellets||1,sx=player.x+Math.cos(player.a)*9,sy=player.y+Math.sin(player.a)*9;
  for(let k=0;k<n;k++){
    const a=player.a+(n>1?rnd(-.13,.13):rnd(-.02,.02)),ca=Math.cos(a),sa=Math.sin(a);let ex=sx,ey=sy,done=false;
    for(let t=5;t<=W.range&&!done;t+=3){ex=sx+ca*t;ey=sy+sa*t;
      if(solid(ex,ey)){burst(ex,11,ey,2);done=true;break}
      for(const p of peds){if(p.down>0||Math.abs(p.x-ex)>4.5||Math.abs(p.y-ey)>4.5)continue;done=true;
        if(W.stun){p.down=240;p.stun=0;p.angry=0;pop(p.x,p.y,'지지직!','#74b9ff');if(p.boss)p.hp=0}
        else{p.hp-=W.dmg*(n>1?1.2:1.5)*(1+.1*player.sk.gun);p.hit=10;if(p.hp<=0)koPed(p,true);else{p.flee=240;p.a=a}}
        burst(p.x,10,p.y,4);break}
      if(!done)for(const c of cars){if(c===player.car||Math.abs(c.x-ex)>c.w*.5||Math.abs(c.y-ey)>c.w*.5)continue;
        if(Math.hypot(c.x-ex,c.y-ey)<c.w*.45){done=true;if(!W.stun){c.hp-=W.dmg*4;if(c.police&&c.driver)crime(1)}burst(ex,8,ey,4);break}}
    }
    tracers.push({x1:sx,y1:11,z1:sy,x2:ex,y2:10,z2:ey,life:W.stun?8:5,col:W.stun?[.5,.8,1]:[1,.9,.5]});
  }
  burst(sx,11,sy,3);shake=Math.max(shake,W.stun?1:id==='shotgun'?6:3);
  if(W.stun){noise(.25,3000,'bandpass',.15);beep(900,.2,'sawtooth',.03)}else{noise(id==='shotgun'?.3:.16,id==='shotgun'?600:1400,'lowpass',.6);beep(id==='shotgun'?60:110,.12,'square',.08)}
  if(!W.stun){for(const p of peds)if(p.down<=0&&!p.angry&&dist(p,player)<300){p.flee=240;p.a=Math.atan2(p.y-player.y,p.x-player.x)}

}

function horn(){

function toggleCar(){
  if(overlay)return;
  if(player.plane)return exitPlane();
  if(!player.car){const pl=nearPlane();if(pl&&!cars.some(c=>!c.boom&&dist(c,player)<30))return boardPlane(pl)}
  if(player.car){
    const c=player.car;
    for(const s of [-1,1]){const ex=c.x+Math.cos(c.a+s*Math.PI/2)*(c.h/2+6),ey=c.y+Math.sin(c.a+s*Math.PI/2)*(c.h/2+6);
      if(!solid(ex,ey)){player.x=ex;player.y=ey;player.car=null;c.driver=false;c.ai=false;return}}
    toast('여기서는 내릴 수 없어요');
  }else{
    let best=null,bd=30;
    for(const c of cars){if(c.boom)continue;const d=dist(c,player);if(d<bd){bd=d;best=c}}
    if(!best)return;
    if(best.driver){
      const s={x:best.x+Math.cos(best.a+Math.PI/2)*11,y:best.y+Math.sin(best.a+Math.PI/2)*11};
      const p=makePed(s.x,s.y);p.flee=240;p.a=Math.atan2(p.y-player.y,p.x-player.x);
      if(!best.flee)crime(best.police?2:1);toast(best.police?'경찰차를 탈취했다!':best.flee?'범인 차량 확보!':'차량 탈취!','#ff6b6b');
      if(best.flee){best.flee=false;best.hp=0}
    }
    best.driver=false;best.ai=false;best.vx=Math.cos(best.a)*best.v;best.vy=Math.sin(best.a)*best.v;
    player.car=best;beep(220,.08,'triangle',.05);
  }
}
function nearPed(){if(player.car||player.plane||player.inside)return null;let b=null,bd=12;
  for(const p of peds){if(p.down>0||p.angry||Math.abs(p.x-player.x)>20||Math.abs(p.y-player.y)>20)continue;const d=dist(p,player);if(d<bd){bd=d;b=p}}return b}
function nearDoor(){if(player.car||player.plane||player.inside)return null;let best=null,bd=16;
  for(const d of doors){if(d.R.drive&&!d.R.walk||Math.abs(d.ox-player.x)>30||Math.abs(d.oy-player.y)>30)continue;const dd=Math.hypot(d.ox-player.x,d.oy-player.y);if(dd<bd){bd=dd;best=d}}return best}
function nearGarage(){const c=player.car;if(!c)return null;for(const d of doors)if(d.R.drive&&Math.hypot(d.ox+d.nx*22-c.x,d.oy+d.ny*22-c.y)<34)return d;return null}

function ctxAction(){

  if(player.car){const g=nearGarage();if(g&&Math.abs(player.car.v)<2)return {i:g.R.i,t:g.role==='지하 주차장'?'주차<br>하기':g.role==='주유소'?'주유소<br>이용':'정비소<br>이용',f:()=>openShop(g)}}
  else{const d=nearDoor();if(d)return d.kiosk&&!d.R.k?{i:d.R.i,t:'이용<br>하기',f:()=>openShop(d)}:{i:d.R.i,t:d.role==='지하철역'?'지하철<br>타기':'들어<br>가기',f:()=>enterBuilding(d)};
    const p=nearPed();if(p)return {i:p.dealer?'🕶️':p.quest?'❗':'💬',t:p.dealer?'암시장':p.quest?'부탁<br>듣기':'대화',f:()=>openPed(p)};
    const pl=nearPlane();if(pl&&!cars.some(c=>!c.boom&&dist(c,player)<30))return {i:'✈️',t:pl.mine?'탑승':'탈취',f:()=>boardPlane(pl)};

function sleepFor(hours,where,o={}){
  closePanel();timeTick(hours*60);
  player.energy=Math.min(100,player.energy+hours*13);
  player.hp=o.heal&&hours>=6?player.maxHp:Math.min(player.maxHp,player.hp+hours*6);
  player.hunger=Math.max(5,player.hunger-hours*2.2);
  overlay={t:'💤 Zzz…',s:`${where}에서 ${hours}시간 잤어요 · 지금 ${String(Math.floor(hourOf())).padStart(2,'0')}:${String(Math.floor(econ.min%60)).padStart(2,'0')}`,c:'#a29bfe',life:150};
  if(o.risk&&Math.random()<o.risk){const l=Math.round(player.money*.25/100)*100;player.money-=l;setTimeout(()=>toast(`😱 자는 동안 지갑에서 ${won(l)}을 털렸어요!`,'#ff6b6b'),2600)}
  if(hours>=6)gainXP(5,'푹 잠');save();return null}
function sleepItems(add,where,o={}){
  add('🛏️','푹 자기 (8시간)','💤 피로 완전 회복 · 체력 회복 · 저장',o.price||0,()=>sleepFor(8,where,Object.assign({heal:true},o)));
  add('😴','낮잠 (2시간)','💤 피로 +26',o.price?Math.round(o.price*.4/100)*100:0,()=>sleepFor(2,where,o));
}
function energyTick(){
  if(menuOpen||player.inside&&player.jail&&false)return;
  const drain=.0028*(player.spd>3?1.5:1)*(player.car||player.plane?.8:1)*(1-.05*player.sk.run);
  player.energy=Math.max(0,player.energy-drain);
  if(player.energy<=0){player.hp-=.03;if(frame%900===0){toast('💤 너무 졸려요… 체력이 깎이고 있어요! (집·모텔·찜질방·공원 벤치)','#a29bfe');shake=Math.max(shake,4)}}
  else if(player.energy<20&&frame%2400===0)toast('💤 졸려요. 잠을 자야 해요','#a29bfe');
}
function nearestDoor(f){let b=null,bd=1e9;const P=anchor();for(const d of doors)if(f(d)){const k=Math.hypot(d.ox-P.x,d.oy-P.y);if(k<bd){bd=k;b=d}}return b}

function flyPlayer(p){
  const I=menuOpen?{x:0,y:0}:inputVec(),T=p.T;
  if(p.alt<=0){
    const up=I.y<-.25,dn=I.y>.25;
    if(up)p.v+=T.acc*(1-p.v/T.max*.45);if(dn)p.v=Math.max(0,p.v-.15);if(!up&&!dn)p.v*=.994;if(HB())p.v*=.95;p.v=clamp(p.v,0,T.max);
    p.a+=clamp(I.x,-1,1)*T.turn*1.4*Math.min(1,p.v/2+.25);p.pitch*=.8;p.roll*=.85;
    if(p.v>=T.take&&up){p.alt=.6;p.pitch=.14;toast('🛫 이륙!','#7CFC7C');beep(200,.6,'sawtooth',.03)}
    const nx=p.x+Math.cos(p.a)*(T.L*.5),ny=p.y+Math.sin(p.a)*(T.L*.5);
    if(solid(nx,ny)){if(p.v>4)return crashPlane(p,'건물에 충돌했다!');p.v=0;return}
    for(const q of peds)if(q.down<=0&&Math.abs(q.x-p.x)<T.L*.4&&Math.abs(q.y-p.y)<T.L*.4&&p.v>1.5){q.down=300;q.hp=0}
  }else{
    const thr=RUN()?1:HB()?-1:0,tv=T.max*(.72+.28*thr)*(thr<0?.75:1);p.v+=(tv-p.v)*.012;
    const tp=clamp(-I.y,-1,1)*.42;p.pitch+=(tp-p.pitch)*.05;
    const tr=clamp(I.x,-1,1)*.75;p.roll+=(tr-p.roll)*.06;p.a+=p.roll*T.turn*1.15;
    if(p.v<T.take*.85){p.pitch=Math.max(p.pitch-.012,-.7);if(frame%60===0)toast('⚠️ 실속! 속도를 올리세요 (부스트)','#ff6b6b')}
    p.alt=Math.min(1800,p.alt+Math.sin(p.pitch)*p.v);
    const P0=Math.hypot(p.x-WW/2,p.y-WH/2);if(p.x<-900||p.x>WW+900||p.y<-900||p.y>WH+900){p.a=lerpAng(p.a,Math.atan2(WH/2-p.y,WW/2-p.x),.03);if(frame%120===0)toast('↩️ 공역 경계 — 자동 선회','#ffd34d')}
    if(p.alt<=0){const vs=Math.sin(p.pitch)*p.v,flat=!isWater(p.x,p.y)&&heightAt(p.x,p.y)<1;
      if(vs<-1.6||!flat||Math.abs(p.roll)>.5)return crashPlane(p,flat?'착륙 실패! 너무 세게 내려왔다':'착륙할 수 없는 곳이다!');
      p.alt=0;p.pitch=0;p.roll=0;toast(inAirport(p.x,p.y)?'🛬 활주로 착륙 성공!':'🛬 비상 착륙 성공!','#7CFC7C');gainXP(p.type==='jet'?60:25,'착륙')}
    else if(p.alt<heightAt(p.x,p.y)-1)return crashPlane(p,'건물에 충돌했다!');
  }
  const hv=p.v*Math.cos(p.pitch);p.x+=Math.cos(p.a)*hv;p.y+=Math.sin(p.a)*hv;p.prop+=p.v*.35+.25;

function planeAI(){

  if(!ambJet){if(--ambT<=0&&Math.hypot(P.x-1000,P.y-4600)<3500){ambJet=makePlane('jet',RWY.x0+120,RWY.z,0,{livery:pick(['#0097e6','#e84118','#44bd32']),amb:1,v:0});ambT=3000+Math.random()*2000}return}

  if(p.alt<=0){p.v=Math.min(p.T.max,p.v+.04);if(p.v>=p.T.take){p.alt=.5;p.pitch=.16}}
  else{p.pitch+=(.18-p.pitch)*.02;p.alt+=Math.sin(p.pitch)*p.v;if(p.alt>420)p.pitch*=.95}

function wantedLogic(){
  const P=anchor();
  if(wanted>0&&!player.inside){
    let near=false,seen=false;
    for(const c of cars){if(!c.police||!c.driver||c.hp<=0)continue;const d=dist(c,P);if(d<650)seen=true;
      if(d<55&&(!player.car||Math.abs(player.car.v)<1.2))near=true}
    calm=seen?0:calm+1;
    if(calm>420){wanted--;heat=wanted;calm=0;toast(wanted?'수배 레벨 감소':'수배 해제! 따돌렸다','#7CFC7C')}

    if(bust>150)sendToJail()

  if(player.hp<=0){const fee=priceOf(2000,doors[0]);player.money=Math.max(0,player.money-fee);player.hp=player.maxHp*.6;player.hunger=Math.max(player.hunger,40);player.armor=0;

}

function update(){
  frame++;
  if(!started)return;
  if(overlay){overlay.life--;if(overlay.life<=0)overlay=null;return}
  if(mapOpen)return;
  timeTick();
  if(player.car)drivePlayer(player.car);else if(player.plane)flyPlayer(player.plane);else walkPlayer();
  planeAI();
  for(const c of cars){if(c===player.car)continue;
    if(c.racer){racerMove(c);continue}
    if(c.police&&c.driver)policeAI(c);else if(c.ai&&c.driver&&c.hp>0)aiDrive(c);else coast(c);
    if(c.hp<35&&frame%4===0&&Math.abs(c.x-player.x)<1500)parts.push({x:c.x,y:c.y,vx:rnd(-.3,.3),vy:rnd(-.6,-.2),life:60,r:rnd(4,8),dark:c.hp<=0})}
  if(player.car&&player.car.hp<35&&frame%4===0)parts.push({x:player.car.x,y:player.car.y,vx:rnd(-.3,.3),vy:rnd(-.6,-.2),life:60,r:rnd(4,8),dark:player.car.hp<=0});
  combat();carCollisions();hits();updatePeds();needs();wantedLogic();missionLogic();interiorLogic();heistLogic();jailLogic();ambientTick();
  if(frame%60===0)blackMarketLogic();if(lvFx>0)lvFx--;for(let i=xpFx.length-1;i>=0;i--)if(--xpFx[i].life<=0)xpFx.splice(i,1);if(resultCard&&--resultCard.life<=0)resultCard=null;
  if(frame%15===0)populate();
  for(let i=skids.length-1;i>=0;i--)if(--skids[i].life<=0)skids.splice(i,1);if(skids.length>500)skids.splice(0,skids.length-500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.r+=.15;if(--p.life<=0)parts.splice(i,1)}
  if(parts.length>160)parts.splice(0,parts.length-160);
  for(let i=toasts.length-1;i>=0;i--)if(--toasts[i].life<=0)toasts.splice(i,1);
  shake*=.85;
  if(frame%1200===0)save();
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function openShop(d){const R=d.R;if(R.k==='bank'||d.role==='ATM')panelState={type:'bank',door:d,tab:d.role==='증권사'?'stock':'bank',atm:d.role==='ATM'};else panelState={type:'shop',door:d};menuOpen=true;mouseAtk=false;exitLock();renderPanel()}
function openPhone(tab='status'){panelState={type:'phone',tab};menuOpen=true;mouseAtk=false;exitLock();renderPanel()}
function openPed(p){const behind=Math.abs(angDiff(Math.atan2(player.y-p.y,player.x-p.x),p.a))>1.9;if(!p.quest&&!p.dealer)p.idle=Math.max(p.idle,600);p.spd=0;
  if(!behind||p.quest||p.dealer)p.a=Math.atan2(player.y-p.y,player.x-p.x);panelState={type:'ped',p,behind,say:p.dealer?'…뭘 찾지? 경찰한테는 비밀이야.':p.quest?p.quest.t:pedGreet(p)};menuOpen=true;mouseAtk=false;exitLock();renderPanel()}
const fmtMin=m=>`${Math.floor(m/60)}시간 ${Math.round(m%60)}분`;
const TIPS=['밤 8시가 넘으면 홍대 클럽 근처에 수상한 무기상이 나타난대요.','학원에서 운전 학원을 다니면 운전이 훨씬 쉬워진대요.','정비소에서 도색하면 경찰이 못 알아본대요.','부동산에서 가게를 사면 매일 돈이 들어온대요.',
  '버스 타면 순식간에 다른 동네로 갈 수 있어요.','강남은 비싸니까 노량진에서 사 먹어요.','은행 금고는 오른쪽 벽에 있대요… 물론 농담이죠?','편의점 복권 1등이 50만 원이래요!','증권사 뉴스 보고 주식 사면 대박 날 수도?'];
function pedGreet(p){const h=hourOf();if(wanted>=2)return pick(['히익… 저, 저는 아무것도 못 봤어요!','사, 살려주세요…']);if(rainK>.4)return pick(['비가 엄청 오네요.','우산 안 가져오셨어요?']);
  return pick(h<11?['좋은 아침이에요!','출근길이라 바빠요~']:h>21?['밤늦게 뭐 하세요?','이 시간엔 조심하세요.']:['안녕하세요!','무슨 일이세요?','네? 저요?','날씨 좋네요.'])}
function pedLine(p){return pick(TALK.concat(['저 '+districtRaw(p.x,p.y)+' 토박이예요.','요즘 물가가 너무 올랐어요.','어제 '+pick(econ.stocks).n+' 주식 샀어요!','한강에서 치맥 하면 최고죠.']))}
function stealChance(p,behind){return clamp(.35+.1*player.sk.stealth+(behind?.25:0)-(wanted?.1:0),.05,.95)}
function pickpocket(p,ch){closePanel();p.idle=0;
  if(Math.random()<ch){const loot=Math.round(rnd(500,4000)*(1+.2*player.sk.stealth)/100)*100;player.money+=loot;p.robbed=1;player.stats.steals++;gainXP(12,'소매치기');noise(.05,4000,'highpass',.05);return `🤏 지갑 슬쩍! +${won(loot)}`}
  pop(p.x,p.y,'도둑이야!!','#ff6b6b');if(Math.random()<.5)p.angry=900;else{p.flee=300;p.a=Math.atan2(p.y-player.y,p.x-player.x)}
  crime(cars.some(c=>c.police&&c.driver&&dist(c,player)<500)?1:.6);for(const q of peds)if(q!==p&&q.down<=0&&!q.angry&&dist(q,p)<150){q.flee=200;q.a=Math.atan2(q.y-p.y,q.x-p.x)}return '😱 들켰다!'}
function threaten(p){closePanel();p.idle=0;const ok=Math.random()<.7+.05*player.sk.talk+(WEAP[player.cur].melee?0:.12);crime(1);
  if(ok){const loot=Math.round(rnd(2000,8000)*(1+.2*player.sk.stealth)/100)*100;player.money+=loot;p.robbed=1;p.flee=400;p.a=Math.atan2(p.y-player.y,p.x-player.x);gainXP(15,'협박');pop(p.x,p.y,'가져가세요!','#ff9f43');return `💰 겁먹고 지갑을 줬다 +${won(loot)}`}
  p.angry=900;pop(p.x,p.y,'어디서 협박이야!','#ff6b6b');return '😠 덤벼든다!'}
function closePanel(){panel.classList.remove('show');menuOpen=false;panelState=null}
function btn(it,cls=''){const idx=curItems.push(it)-1,can=!it.dis&&player.money>=(it.p||0);
  return `<button class="it ${cls}" data-i="${idx}" ${can?'':'disabled'}><span class="ic">${it.i}</span><span class="nm">${esc(it.n)}<span class="ds">${esc(it.d||'')}</span></span><span class="pr">${it.p?won(it.p):(it.pl||'')}</span></button>`}
const row=(a,b,cl='')=>`<div class="row"><span>${a}</span><b class="${cl}">${b}</b></div>`;
function tabs(list,cur){return `<div class="tabs">${list.map(([k,n])=>`<button data-tab="${k}" class="${k===cur?'sel':''}">${n}</button>`).join('')}</div>`}
function stockHTML(fee){
  let h=`<div class="sub">수수료 ${(fee*100).toFixed(1)}% · 가격은 1시간(게임)마다 바뀌어요 · 평가액 ${won(portfolioValue())}</div>`;
  for(const s of econ.stocks){const ch=s.p/s.open-1,own=player.stocks[s.id]||0,p=Math.round(s.p),buy=Math.ceil(p*(1+fee));
    h+=`<div class="row"><span>${s.n} <small style="color:#99a">보유 ${own}주</small></span><b class="${ch>=0?'up':'dn'}">${won(p)} ${ch>=0?'▲':'▼'}${Math.abs(ch*100).toFixed(1)}%</b></div>`;
    h+=`<div style="display:flex;gap:6px">`+[1,10].map(q=>btn({i:'',n:`${q}주 사기`,d:'',p:buy*q,act(){player.stocks[s.id]=own+q;return `📈 ${s.n} ${q}주 매수`}},'sm')).join('')+
      btn({i:'',n:'전부 팔기',d:'',p:0,pl:own?'+'+won(own*p*(1-fee)):'-',dis:!own,act(){player.money+=Math.floor(own*p*(1-fee));player.stocks[s.id]=0;return `📉 ${s.n} 매도 +${won(own*p*(1-fee))}`}},'sm')+`</div>`}
  if(econ.news.length)h+=`<div class="sub" style="margin-top:8px">📰 최근 뉴스<br>${econ.news.slice(0,4).map(n=>`· ${esc(n.t)} <small>(${n.d}일 ${n.h}시)</small>`).join('<br>')}</div>`;
  return h;
}
function renderPanel(){
  const s=panelState;if(!s)return;let h='';curItems=[];
  if(s.type==='shop'){const M=shopMenu(s.door);h+=`<h2>${esc(M.title)}</h2><div class="sub">${esc(M.sub)} · 지갑 ${won(player.money)}</div>`;
    if(s.door.R.k==='food'||s.door.R.k==='store'||s.door.R.k==='cafe')h+=`<div class="sub">🍔 배고픔 ${Math.round(player.hunger)}/100 · ❤️ ${Math.round(player.hp)}/${player.maxHp}</div>`;
    for(const it of M.items)h+=btn(it);if(!M.items.length)h+='<div class="sub">이용할 수 있는 것이 없어요</div>'}
  if(s.type==='bank'){h+=`<h2>${s.door.R.i} ${esc(s.door.role)}</h2>`+(s.atm?'':tabs([['bank','🏦 은행'],['stock','📈 주식']],s.tab));
    if(s.door.role==='은행'&&!s.atm&&s.tab==='bank'){const okW=player.weapons.pistol||player.weapons.shotgun,done=s.door.robDay===econ.day;
      h+=btn({i:'💣',n:'은행 털기',d:player.lv<4?'🔒 Lv.4 필요':!okW?'권총이나 산탄총이 필요해요 (총포사 · 밤의 암시장)':done?'오늘은 경비가 삼엄해요':'금고 앞에서 10초 버티면 대박 · 수배 ★★★★',p:0,dis:player.lv<4||!okW||done||!!heist,act(){startHeist(s.door);return null}})}
    if(s.tab==='bank'){const maxLoan=Math.round(100000*econ.infl/1000)*1000*(player.lv>=6?2:1),q=Math.round(10000*econ.infl/1000)*1000;
      h+=row('👛 지갑',won(player.money))+row('🏦 예금 (하루 0.6% 이자)',won(player.bank))+row('💳 대출 (하루 1.5% 이자)',won(player.loan),player.loan?'up':'')+row('🏷️ 내 가게',player.biz.length+'곳 · 하루 '+won(player.biz.reduce((a,id)=>a+bizIncome(doors[id]),0)));
      h+=`<div class="sub">은행 돈은 쓰러지거나 체포돼도 안전해요.</div>`;
      h+=btn({i:'⬇️',n:`입금 ${won(q)}`,p:q,act(){player.bank+=q;return '입금 완료'}});
      h+=btn({i:'⬇️',n:'전액 입금',d:won(player.money),p:0,dis:player.money<=0,act(){player.bank+=player.money;player.money=0;return '전액 입금'}});
      h+=btn({i:'⬆️',n:`출금 ${won(q)}`,p:0,dis:player.bank<q,act(){player.bank-=q;player.money+=q;return '출금 완료'}});
      h+=btn({i:'⬆️',n:'전액 출금',d:won(player.bank),p:0,dis:player.bank<=0,act(){player.money+=player.bank;player.bank=0;return '전액 출금'}});
      h+=btn({i:'💳',n:`대출 ${won(q*2)}`,d:`한도 ${won(maxLoan)}`,p:0,dis:player.loan+q*2>maxLoan,act(){player.loan+=q*2;player.money+=q*2;return '대출 실행'}});
      h+=btn({i:'✅',n:'대출 상환',d:won(Math.min(player.loan,player.money+player.bank)),p:0,dis:!player.loan||player.money+player.bank<=0,act(){let r=Math.min(player.loan,player.money);player.money-=r;player.loan-=r;
        const r2=Math.min(player.loan,player.bank);player.bank-=r2;player.loan-=r2;return '상환 완료'}})}
    else h+=stockHTML(.001)}
  if(s.type==='ped'){const p=s.p;h+=`<h2>${p.dealer?'🕶️ 수상한 남자':(p.look.f?'👩 ':'👨 ')+esc(pedName(p))}</h2>`;
    if(s.say)h+=`<div class="sub" style="color:#fff;background:rgba(255,255,255,.08);padding:9px 11px;border-radius:10px">"${esc(s.say)}"</div>`;
    if(p.dealer)h+=btn({i:'🕶️',n:'물건 보기',d:'레벨 제한 없는 무기 · 비싸요',p:0,act(){openShop(BM_DOOR);return null}});
    else{if(p.quest)h+=btn({i:'❗',n:'부탁 들어보기',d:mission?'진행 중인 미션이 있어요':`${MT[p.quest.type].i} ${MT[p.quest.type].n} · 보상 높음`,p:0,dis:!!mission,act(){openBrief(p.quest.type,{giver:p,text:p.quest.t});return null}});
      h+=btn({i:'💬',n:'대화하기',p:0,act(){s.say=pedLine(p);if(!p.talked){p.talked=1;gainXP(2)}return null}});
      h+=btn({i:'🗺️',n:'길 묻기',d:'가까운 곳을 지도에 표시해 줘요',p:0,act(){s.ask=!s.ask;return null}});
      if(s.ask)for(const [ic,n,f] of [['🍔','식당',q=>q.R.k==='food'],['🏪','편의점',q=>q.role==='편의점'],['🏥','병원',q=>q.role==='병원'],['🔫','총포사',q=>q.role==='총포사'],['🏦','은행',q=>q.role==='은행'],['🔧','정비소',q=>q.R.drive],['🚏','버스정류장',q=>q.role==='버스정류장'],['🏧','ATM',q=>q.role==='ATM']]){
        h+=btn({i:ic,n:`${n} 어디예요?`,p:0,act(){let b=null,bd=1e9;for(const q of doors)if(f(q)){const d=Math.hypot(q.ox-player.x,q.oy-player.y);if(d<bd){bd=d;b=q}}
          if(b){player.nav={x:b.ox,y:b.oy};s.say=`${b.role}요? ${districtRaw(b.x,b.y)} 쪽으로 ${(bd*2.5/1000).toFixed(1)}km 가시면 있어요.`;s.ask=0;return '📍 지도에 표시했어요 (초록 기둥)'}return null}})}
      h+=btn({i:'💸',n:'용돈 주기',d:'기분이 좋아지면 꿀팁을 알려줘요',p:priceOf(1000,doors[0]),act(){gainXP(3);s.say=pick(TIPS);return null}});
      const ch=stealChance(p,s.behind);
      h+=btn({i:'🤏',n:'지갑 훔치기',d:p.robbed?'이미 털었어요':`성공 ${Math.round(ch*100)}%${s.behind?' (등 뒤라서 유리!)':' · 등 뒤에서 말 걸면 더 쉬워요'} · 들키면 수배`,p:0,dis:!!p.robbed,act(){return pickpocket(p,ch)}});
      h+=btn({i:'🔫',n:'협박하기',d:player.lv<2?'🔒 Lv.2 필요':player.cur==='fist'?'무기를 들고 있어야 해요 (Q)':'돈을 뜯어요 · 수배 ★',p:0,dis:player.lv<2||player.cur==='fist'||!!p.robbed,act(){return threaten(p)}})}}
  if(s.type==='brief'){const T=MT[s.mt],g=s.src.giver;h+=`<h2>${T.i} ${T.n}</h2>`;
    if(g)h+=`<div class="sub" style="color:#fff;background:rgba(255,255,255,.08);padding:9px 11px;border-radius:10px">${g.look.f?'👩':'👨'} ${esc(pedName(g))}: "${esc(s.src.text)}"</div>`;
    h+=`<div class="sub">${esc(T.d)}</div><div class="sub"><b style="color:#fff">목표</b><br>${T.steps.map((t,i)=>`${i+1}. ${esc(t)}`).join('<br>')}</div>`;
    const est=Math.round(({delivery:4000,taxi:4500,thug:8000,steal:12000,race:11000,collect:7000,escape:9000,chase:13000,find:6000,ride:5000}[s.mt])*(g?(g.quest?g.quest.mult:1.3):1)*rewardMult()/100)*100;
    h+=row('💰 기본 보상',won(est)+' + 등급 보너스')+row('⭐ 경험치',`약 ${Math.round((50+est/120)*(g?1.3:1))} XP`)+(T.car?row('🚗 필요','차량'):'')+row('🏅 등급','S 1.5배 · A 1.25배 · B 1.1배');
    h+=btn({i:'✅',n:'수락하기',p:0,act(){acceptBrief();return null}})+btn({i:'✖️',n:'나중에',p:0,act(){closePanel();return null}})}
  if(s.type==='bench'){h+=`<h2>🪑 벤치</h2><div class="sub">공짜로 잘 수 있지만 자는 동안 지갑을 털릴 수도 있어요 (40%).</div>`;
    h+=btn({i:'😴',n:'벤치에서 자기 (4시간)','d':'💤 피로 +50 · 무료',p:0,act(){return sleepFor(4,'공원 벤치',{risk:.4})}});
    h+=btn({i:'🧘',n:'잠깐 쉬기 (1시간)','d':'💤 피로 +13',p:0,act(){return sleepFor(1,'벤치',{risk:.1})}})}
  if(s.type==='jail'){const J=player.jail;if(J){const bail=priceOf(4000+J.left*120,doors[0]);
    h+=`<h2>🔒 서울 구치소</h2><div class="sub">남은 형기 <b style="color:#fff">${fmtMin(J.left)}</b> · 들킨 횟수 ${J.caught}회</div>`;
    h+=btn({i:'⏳',n:'형기 채우기',d:`시간이 ${fmtMin(J.left)} 흘러요 · 배고픔 감소`,p:0,act(){const m=J.left;closePanel();timeTick(m);player.hunger=Math.max(5,player.hunger-m/12);releaseJail('🔓 출소! 착하게 살아요');return null}});
    h+=btn({i:'💰',n:'보석금 내기',d:'바로 풀려나요',p:bail,act(){closePanel();releaseJail('💰 보석으로 석방!');return null}});
    h+=btn({i:'⚖️',n:'변호사 선임',d:J.lawyer?'이미 선임했어요':'형기 절반으로 감형',p:Math.round(bail*.4/100)*100,dis:!!J.lawyer,act(){J.left=Math.round(J.left/2);J.lawyer=1;return '⚖️ 형기 절반 감형!'}});
    h+=btn({i:'🍚',n:'콩밥 먹기',d:'배고픔 +35 (무료 · 한 번)',p:0,dis:!!J.ate,act(){player.hunger=Math.min(100,player.hunger+35);J.ate=1;return '🍚 꿀맛'}});
    h+=`<div class="sub">🔧 <b style="color:#fff">탈옥</b>: 감방 뒤쪽 환풍구(초록 원) 위에 서 있으면 뜯어요. 간수가 이쪽을 보면 원이 빨개져요 — 그때 환풍구에 있으면 들켜서 형기 +30분!</div>`}}
  if(s.type==='phone'){h+=`<h2>📱 휴대폰</h2>`+tabs([['status','내 정보'],['skill','스킬'],['mission','미션'],['stock','주식'],['set','설정'],['help','도움말']],s.tab);
    if(s.tab==='skill'){h+=row('⭐ 레벨',`Lv.${player.lv}`)+row('✨ 경험치',`${player.xp} / ${xpNeed(player.lv)}`)+row('🎯 스킬 포인트',player.sp,player.sp?'up':'');

    if(s.tab==='set'){const opt=(label,key,vals)=>`<div class="row"><span>${label}</span></div><div style="display:flex;gap:6px">`+vals.map(([v,n])=>`<button class="it sm" data-set="${key}" data-v="${v}" style="${settings[key]==v?'background:#ffd34d;color:#222':''}"><span class="nm">${n}</span></button>`).join('')+`</div>`;
      h+=opt('🚗 조향 감도 (핸들 반응)','steer',[[.7,'낮음'],[1,'보통'],[1.35,'높음']])+opt('⚡ 차 최고 속도','speed',[[.6,'60%'],[.75,'75%'],[.85,'85%'],[1,'100%']])+opt('🖱️ 시점 회전 감도','cam',[[.6,'낮음'],[1,'보통'],[1.6,'높음']])+opt('🛣️ 직진 보조 (도로 방향 자동 정렬)','assist',[['1','켜기'],['0','끄기']])}
    if(s.tab==='status'){const W=WORDER.filter(w=>player.weapons[w]).map(w=>WEAP[w].i+(WEAP[w].melee?'':player.ammo[w])).join(' ');

    ctx.font=`${mob?9:11}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';for(const d of doors)if(MAPICON[d.role]&&inb(d.x,d.y))ctx.fillText(MAPICON[d.role],MX(d.x),MY(d.y));

  {let yy=by+24;for(const f of xpFx){ctx.globalAlpha=Math.min(1,f.life/25);txt(f.t,14,yy,'#c8b6ff',F(13),'left',3);yy+=16}ctx.globalAlpha=1}

// ---------- 시점 조작: 마우스(포인터 고정) · 터치 드래그 ----------
let lookId=null,lookX=0,lookY=0;
glc.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){if(!started)start();if(menuOpen)return;
    if(document.pointerLockElement!==glc){try{const r=glc.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(_){}}
    else if(e.button===0){mouseAtk=true;attack()}return}
  if(!started||menuOpen)return;if(lookId===null){lookId=e.pointerId;lookX=e.clientX;lookY=e.clientY}});
addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lookX,dy=e.clientY-lookY;lookX=e.clientX;lookY=e.clientY;
  camYaw+=dx*.0065*settings.cam;camPitch=clamp(camPitch+dy*.004*settings.cam,-.35,.9);manualT=frame});
const lookEnd=e=>{if(e.pointerId===lookId)lookId=null};addEventListener('pointerup',lookEnd);addEventListener('pointercancel',lookEnd);
addEventListener('mouseup',e=>{if(e.button===0)mouseAtk=false});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===glc&&!menuOpen){camYaw+=e.movementX*.0028*settings.cam;camPitch=clamp(camPitch+e.movementY*.0022*settings.cam,-.35,.9);manualT=frame}});
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==glc)mouseAtk=false});

// ---------- 터치 컨트롤 ----------
(function(){
  const joy=document.getElementById('joy'),knob=document.getElementById('knob');let pid=null;
  function setK(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const R=r.width/2-10,d=Math.hypot(dx,dy);
    if(d>R){dx*=R/d;dy*=R/d}touch.x=dx/R;touch.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
  joy.addEventListener('pointerdown',e=>{e.preventDefault();if(!started)start();pid=e.pointerId;joy.setPointerCapture(pid);touch.active=true;setK(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===pid)setK(e)});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;touch.active=false;touch.x=touch.y=0;knob.style.transform=''};
  joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
  const B=(id,down,up)=>{const b=document.getElementById(id);
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!started){start();return}b.classList.add('on');down&&down()});
    const u=e=>{b.classList.remove('on');up&&up()};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('pointerleave',u);
    b.addEventListener('contextmenu',e=>e.preventDefault())};
  B('bF',()=>doAction());B('bH',()=>horn());B('bCam',()=>{camMode=1-camMode});B('bW',()=>switchWeapon());
  B('bAtk',()=>{touch.atk=true;attack()},()=>touch.atk=false);
  B('bHB',()=>touch.hb=true,()=>touch.hb=false);B('bR',()=>touch.run=true,()=>touch.run=false);
  document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('#panel'))e.preventDefault()},{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
})();
const bFi=document.getElementById('bFi'),bFt=document.getElementById('bFt'),bAtkI=document.querySelector('#bAtk span');let lastCtx='',lastW='';
function uiTick(){
  const a=ctxAction()||{i:'✖️',t:'닫기'};const key=a.i+a.t;if(key!==lastCtx){lastCtx=key;bFi.textContent=a.i;bFt.innerHTML=a.t}
  const w=WEAP[player.cur].i;if(w!==lastW){lastW=w;bAtkI.textContent=w}
  const ic=!!(player.car||player.plane);if(ic!==inCarUI){inCarUI=ic;document.body.classList.toggle('incar',ic)}
}

let last=performance.now(),acc=0,inCarUI=false;
function loop(t){const dt=Math.min(100,t-last);last=t;acc+=dt;let n=0;
  while(acc>=16.67&&n<5){update();acc-=16.67;n++}if(n>=5)acc=0;
  if(n){render3D();drawHUD();if(mapOpen&&frame%8===0)drawMap();if(frame%6===0)uiTick()}
  perfTick(dt,n>0);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
